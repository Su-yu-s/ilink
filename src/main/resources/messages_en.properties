# Privacy policy body copy (trusted static HTML from this bundle)
legal.privacy.s1.body=<p class="lg-p">iLink collects only the information needed to support teams, mentor recruitment, collaboration, and project showcases. This includes:</p><ul class="lg-list"><li><b>Account information</b>: Phone number, student or staff ID, email address, bcrypt-hashed password, and account type (student, teacher, or administrator).</li><li><b>Profile information</b>: Name, avatar, gender, and any school, department, major, year, skill tags, bio, or honors you provide. Teachers may also add their title, research interests, and mentor profile.</li><li><b>Collaboration records</b>: Team requests you post, applications you submit, teams you join, team tasks, and milestone progress.</li><li><b>Published content</b>: Community articles, showcased work, uploaded attachments, and comments.</li><li><b>Security and administration records</b>: Device identifiers used for remembered sign-in (browser identifiers), plus IP addresses and browser identifiers recorded for administrator actions. The platform does not currently detect unusual sign-ins.</li></ul>
legal.privacy.s2.body=<div class="lg-def"><div class="lg-def__row"><div class="lg-def__k">Core features</div><div class="lg-def__v">To sign in, post a team request, apply to a team, collaborate in a team workspace, and showcase work.</div></div><div class="lg-def__row"><div class="lg-def__k">Matching and recommendations</div><div class="lg-def__v">To recommend teams, mentors, and competitions based on the major, skills, and competition interests you provide.</div></div><div class="lg-def__row"><div class="lg-def__k">Notifications</div><div class="lg-def__v">To notify you about team applications, decisions, task changes, and platform messages.</div></div><div class="lg-def__row"><div class="lg-def__k">Safety and operations</div><div class="lg-def__v">Administrators can maintain platform content and manage account status. A suspended account cannot sign in or use platform features until it is restored.</div></div></div>
legal.privacy.s3.body=<p class="lg-p">The information shown depends on the page. The descriptions below reflect the current version of the platform:</p><ul class="lg-list"><li><span class="lg-tag lg-tag--public">Public</span>　Your name, avatar, school, department, major, year, bio, and honors, plus community articles and work you publish. If you have not provided a name, the page shows a role-based label.</li><li><span class="lg-tag lg-tag--private">Private</span>　Your phone number, email, student or staff ID, password, and internal account identifier do not appear on public profiles.</li><li><span class="lg-tag lg-tag--private">Team applications</span>　Skill tags are used for team matching and applicant profiles; they are not shown on public profiles.</li><li><span class="lg-tag lg-tag--private">Team members only</span>　Tasks, files, discussions, and weekly reports in a team workspace are visible only to that team's members.</li></ul><div class="lg-note"><p class="lg-note__t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Contact details</p><p>If you choose to include WeChat, QQ, or other contact details in your bio, visitors can see them. Consider using platform messages first and sharing contact details only after confirming who you are speaking with.</p></div>
legal.privacy.s4.body=<p class="lg-p">iLink does not sell personal information or use it for advertising unrelated to competition collaboration. Information may be shared outside the platform only in these situations:</p><ul class="lg-list"><li>You choose to use a third-party feature connected to the platform. For example, task title, description, type, deadline, and competition name are sent to Alibaba Cloud Bailian when you use the AI assistant to break down a task. Competition Q&amp;A sends your question, public competition materials, and web search results to the model service. Group chat content and members' profile information are not sent to the AI service.</li><li>Disclosure is required by law or requested by a judicial or regulatory authority under applicable law.</li></ul>
legal.privacy.s5.body=<ul class="lg-list"><li>Passwords are stored as bcrypt hashes. Production uses HTTPS; local development may use HTTP.</li><li>Internal access follows the minimum-necessary principle, and administrative actions are recorded for audit.</li><li>We retain the data needed to provide the service while your account is active. Closing your account starts deletion of your account, profile, published content, team collaboration records, notifications, and platform messages.</li></ul>
legal.privacy.s6.body=<div class="lg-def"><div class="lg-def__row"><div class="lg-def__k">Access and correct</div><div class="lg-def__v">View and update your profile in Profile. Your username is an internal identifier and cannot be changed by you.</div></div><div class="lg-def__row"><div class="lg-def__k">Delete content</div><div class="lg-def__v">You can delete team requests, community articles, and work items that you published.</div></div><div class="lg-def__row"><div class="lg-def__k">Close account</div><div class="lg-def__v">Go to Profile → Close account, verify your current password, and confirm. Your account and related data will be permanently deleted. If you created a team that still has approved members, transfer or dissolve that team first.</div></div><div class="lg-def__row"><div class="lg-def__k">Other requests</div><div class="lg-def__v">To request a copy of your information or ask how it is handled, contact an administrator through the feedback control at the bottom of the page.</div></div></div>
legal.privacy.s7.body=<p class="lg-p">iLink is intended for university students and teachers. Users under 18 should use the platform with guidance from a guardian and avoid adding sensitive information such as a home address or national ID to public profiles.</p>
legal.privacy.s8.body=<p class="lg-p">If a change to this policy may affect your rights, we will notify you on the platform and update the date and version at the top of this page. Continued use means you have reviewed the updated policy.</p><p class="lg-p">If you have questions about this policy, contact an administrator through the feedback control.</p>

# Terms body copy (trusted static HTML from this bundle)
legal.terms.t1.body=<p class="lg-p">iLink helps university students and teachers find teammates, mentors, and competition opportunities, then coordinate projects and preserve their work in a shared team workspace.</p><p class="lg-p">By registering, publishing content, or joining a team, you confirm that you have read and agree to these terms. Stop using the platform if you do not agree.</p>
legal.terms.t2.body=<div class="lg-def"><div class="lg-def__row"><div class="lg-def__k">Accurate identity</div><div class="lg-def__v">Use accurate, reachable identity information when forming teams, applying for mentors, or publishing work. False identities undermine trust between collaborators.</div></div><div class="lg-def__row"><div class="lg-def__k">Account ownership</div><div class="lg-def__v">Each account is for one person. Do not lend, rent, transfer, or share your account with anyone else.</div></div><div class="lg-def__row"><div class="lg-def__k">Account security</div><div class="lg-def__v">Keep your password secure. If you believe someone else has used your account, change your password and contact an administrator through feedback.</div></div><div class="lg-def__row"><div class="lg-def__k">Teacher identity</div><div class="lg-def__v">Teacher accounts receive mentor access after registration. Provide accurate employer, department, and research information; a complete profile will appear on the mentor wall.</div></div></div>
legal.terms.t3.body=<p class="lg-p">Team requests, community articles, and showcased work should relate to university competitions and collaboration. When publishing:</p><ul class="lg-list"><li><b>Be accurate</b>: Do not post false recruitment information, exaggerated competition results, or identity claims about someone else.</li><li><b>Respect others' rights</b>: Upload documents, images, and code that you own or are authorized to share, and cite their sources.</li><li><b>Do not disrupt others</b>: Do not post advertisements, spam, personal attacks, or promotions unrelated to competitions.</li><li><b>Do not publish prohibited material</b>: Do not post material that violates the law, involves academic misconduct, or exposes another person's private information.</li></ul><div class="lg-note"><p class="lg-note__t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Team requests</p><p>When recruiting, state the competition, needed skills, and planned responsibilities. Clear details make it easier to find suitable teammates and avoid misunderstandings later.</p></div>
legal.terms.t4.body=<div class="lg-def"><div class="lg-def__row"><div class="lg-def__k">Applications and approval</div><div class="lg-def__v">Team applications are reviewed by the team creator or a mentor who has joined the team. Explain your interest accurately; approvers may select members based on project needs.</div></div><div class="lg-def__row"><div class="lg-def__k">Leaving a team</div><div class="lg-def__v">Talk with your teammates before leaving. Joining and leaving immediately or repeatedly can disrupt the team's plans.</div></div><div class="lg-def__row"><div class="lg-def__k">Mentor participation</div><div class="lg-def__v">A mentor must join a team as a member before viewing its collaboration records, task progress, and weekly reports.</div></div><div class="lg-def__row"><div class="lg-def__k">Team files</div><div class="lg-def__v">Tasks, files, and discussions in a team workspace are visible only to team members. Do not share them externally without permission.</div></div></div>
legal.terms.t5.body=<ul class="lg-list"><li><b>You retain ownership</b>: Copyright in your articles, work, and attachments remains with you or the original rights holder.</li><li><b>Display permission</b>: To display and share content within iLink, you authorize the platform to store, display, and offer downloads of content you choose to make public.</li><li><b>Collaborative work</b>: Team members determine ownership of work created together in their workspace. The platform does not allocate those rights.</li></ul>
legal.terms.t6.body=<p class="lg-p">iLink provides tools for connecting people and managing collaboration. Please also understand the following:</p><ul class="lg-list"><li>The platform <b>does not guarantee</b> competition results and does not judge or select winners.</li><li>Registration dates, eligibility, and rules are determined by <b>official competition information</b>. Check them before registering.</li><li>Participants are responsible for communications and in-person conduct outside the platform.</li><li>We work to keep the service available but are not responsible for interruptions caused by force majeure or third parties.</li></ul>
legal.terms.t7.body=<p class="lg-p">When these terms are violated, the platform may take action based on the severity:</p><ul class="lg-list"><li><span class="lg-tag lg-tag--public">Reminder</span>　For minor issues, we may send a platform notification asking you to correct the behavior.</li><li><span class="lg-tag lg-tag--stop">Remove content</span>　We may remove false recruitment posts, infringing documents, advertisements, or other prohibited content.</li><li><span class="lg-tag lg-tag--stop">Suspend account</span>　For impersonation, false recruitment, or deliberate disruption, an administrator may suspend the account. A suspended account cannot sign in until an administrator restores it.</li></ul><p class="lg-p">If you believe a decision was mistaken, send details through feedback and an administrator will review it.</p>
legal.terms.t8.body=<p class="lg-p">If an update may affect your rights, we will notify you on the platform and update the date and version at the top of this page. Continued use means you have reviewed the updated terms.</p><p class="lg-p">If you have questions, contact an administrator through the feedback control.</p>

