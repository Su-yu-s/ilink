legal.privacy.contact.body=If you choose to include WeChat, QQ, or other contact details in your profile, other visitors can see them. Consider using platform messages first and sharing contact details only after confirming who you are speaking with.
legal.privacy.thirdPartyIntro=iLink does not sell personal information or use it for advertising unrelated to competition collaboration. Information may be shared outside the platform only in these situations:
legal.privacy.ai=Third-party AI service
legal.privacy.ai.body=When you use the AI assistant to break down a task, its title, description, type, deadline, and competition name are sent to Alibaba Cloud Bailian. Competition Q&A sends your question, public competition materials, and web search results to the model service. Group chat content and members' personal information are not sent to the AI service.
legal.privacy.safeguards.password=Passwords are stored as bcrypt hashes. Production uses HTTPS; local development may use HTTP.
legal.privacy.safeguards.audit=Internal access follows the minimum-necessary principle, and administrative actions are recorded for audit.
legal.privacy.safeguards.retention=We retain the data needed to provide the service while your account is active. Account closure triggers deletion of the account and associated profile, published content, team collaboration records, notifications, and platform messages.
