# 生产环境：java -jar -Dspring.profiles.active=prod
spring:
  flyway:
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        period: 31536000

logging:
  level:
    root: warn
    cn.ilink: info

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  mail:
    from: ${APP_MAIL_FROM:}
  api:
    expose-error-detail: false

file:
  upload-dir: ${FILE_UPLOAD_DIR:/www/wwwroot/ilink/data/uploads}
  access-url-prefix: ${FILE_ACCESS_URL_PREFIX:/uploads/}

upload:
  path: ${FILE_UPLOAD_DIR:/www/wwwroot/ilink/data/uploads}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  servlet:
    session:
      cookie:
        # http 部署时需设置环境变量 SESSION_COOKIE_SECURE=false，否则浏览器拒收 Cookie 导致登录掉线
        secure: ${SESSION_COOKIE_SECURE:true}
