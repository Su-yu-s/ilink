<th:block th:fragment="header(currentUser, activeMenu)">
    <script th:src="@{/js/notification-manager.js}"></script>
    <header class="il-header" id="ilHeader"
            th:attr="data-current-user-id=${currentUser != null ? currentUser.id : null}">
        <div class="il-header__inner">
            <!-- Brand -->
            <a href="/index.html" class="il-header__brand">
                <span class="il-header__logo">iL</span>
                <span class="il-header__title">iLink</span>
            </a>

            <!-- Shared desktop navigation / mobile drawer -->
            <nav class="il-header__nav" id="ilHeaderNav" aria-label="主导航">
                <div class="il-header__drawer-head">
                    <span class="il-header__drawer-title" th:text="#{header.drawer.title}">iLink 导航</span>
                    <button class="il-header__drawer-close" id="menuClose" type="button" th:attr="aria-label=#{header.drawer.close}">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <a th:classappend="${activeMenu == 'home'} ? ' il-header__link--active'" class="il-header__link" href="/index.html" th:text="#{nav.home}">首页</a>
                <a th:classappend="${activeMenu == 'team'} ? ' il-header__link--active'" class="il-header__link" href="/team-market.html" th:text="#{nav.team}">组队大厅</a>
                <a th:classappend="${activeMenu == 'teacher'} ? ' il-header__link--active'" class="il-header__link" href="/teacher-wall.html" th:text="#{nav.teacher}">导师招贤</a>
                <a th:classappend="${activeMenu == 'community'} ? ' il-header__link--active'" class="il-header__link" href="/community.html" th:text="#{nav.community}">交流社区</a>
                <a th:classappend="${activeMenu == 'competition'} ? ' il-header__link--active'" class="il-header__link" href="/competitions.html" th:text="#{nav.competition}">竞赛目录</a>
                <a th:classappend="${activeMenu == 'gallery'} ? ' il-header__link--active'" class="il-header__link" href="/gallery.html" th:text="#{nav.gallery}">成果展示</a>
                <div class="il-header__drawer-footer">
                    <th:block th:if="${currentUser != null}">
                        <a class="il-header__drawer-action" href="/profile.html" th:text="#{nav.profile}">个人中心</a>
                        <a th:if="${#strings.equals(currentUser.role, 'ADMIN')}" class="il-header__drawer-action" href="/admin.html" th:text="#{nav.admin}">管理后台</a>
                    <a class="il-header__drawer-action il-header__drawer-action--danger" href="/api/logout" onclick="event.preventDefault(); logout();" th:text="#{nav.logout}">退出登录</a>
                    </th:block>
                    <th:block th:unless="${currentUser != null}">
                        <a class="il-header__drawer-action" href="/login.html" th:text="#{nav.login}">登录</a>
                        <a class="il-header__drawer-action il-header__drawer-action--primary" href="/register.html" th:text="#{nav.register}">注册</a>
                    </th:block>
                </div>
            </nav>
            <button class="il-header__overlay" id="ilHeaderOverlay" type="button" th:attr="aria-label=#{header.drawer.close}" tabindex="-1"></button>

            <!-- User Area -->
            <div class="il-header__actions">
                <!-- Logged in -->
                <th:block th:if="${currentUser != null}">
                    <button class="notification-bell notification-bell--hidden" id="notificationBell" type="button" th:attr="aria-label=#{header.notifications}" aria-expanded="false" aria-controls="notificationDropdown">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                        <span class="badge notification-bell--hidden" id="unreadCount">0</span>
                    </button>
                    <div class="notification-dropdown notification-dropdown--hidden" id="notificationDropdown">
                        <div class="notification-dropdown__header">
                            <span class="notification-dropdown__title" th:text="#{header.notifications}">通知</span>
                            <button class="notification-dropdown__mark-read" id="markAllNotificationsRead" type="button" th:text="#{header.notifications.readAll}">全部已读</button>
                        </div>
                        <div class="notification-dropdown__list" id="notificationList">
                            <div class="notification-dropdown__empty" th:text="#{header.notifications.empty}">暂无通知</div>
                        </div>
                    </div>
                    <a th:href="@{/profile.html}" class="il-header__user-link"
                       th:attr="aria-label=#{header.user.openProfile}">
                        <div class="il-header__avatar-container"
                             th:with="avatarRenderable=${currentUser.avatar != null && !currentUser.avatar.isEmpty() && (#strings.startsWith(currentUser.avatar, '/uploads/') || #strings.startsWith(currentUser.avatar, '/images/avatars/') || (#strings.startsWith(currentUser.avatar, 'http') && #strings.contains(currentUser.avatar, '/uploads/')))}">
                            <!-- Avatar Image：仅渲染站内受管上传地址与内置头像，避免存量外链假地址产生加载错误 -->
                            <img class="il-header__avatar"
                                 th:if="${avatarRenderable}"
                                 th:src="${currentUser.avatar}"
                                 th:alt="${currentUser.displayName}"
                                 onload="this.style.display='block';var fb=this.parentElement.querySelector('.il-header__avatar-fallback');if(fb){fb.classList.add('il-header__avatar-fallback--hidden');fb.style.display='';fb.setAttribute('aria-hidden','true');}"
                                 onerror="this.style.display='none';var fb=this.parentElement.querySelector('.il-header__avatar-fallback');if(fb){fb.classList.remove('il-header__avatar-fallback--hidden');fb.style.display='flex';fb.removeAttribute('aria-hidden');}">
                            <!-- Avatar Fallback：显示名首字（DisplayNameResolver 保证非空） -->
                            <span class="il-header__avatar-fallback"
                                  th:unless="${avatarRenderable}"
                                  th:text="${currentUser.avatarInitial}">用</span>
                            <span class="il-header__avatar-fallback il-header__avatar-fallback--hidden"
                                  th:if="${avatarRenderable}"
                                  aria-hidden="true"
                                  th:text="${currentUser.avatarInitial}">用</span>
                        </div>
                        <span class="il-header__username" th:text="${currentUser.displayName}">用户</span>
                    </a>
                    <div class="il-header__dropdown" id="userDropdown">
                        <button class="il-header__dropdown-toggle" id="userDropdownToggle" type="button"
                                aria-expanded="false" aria-haspopup="true"
                                th:attr="aria-label=#{header.user.openMenu}">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <div class="il-header__dropdown-menu">
                            <a th:href="@{/profile.html}" class="il-header__dropdown-item">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                                <span th:text="#{nav.profile}">个人中心</span>
                            </a>
                            <a th:if="${#strings.equals(currentUser.role, 'ADMIN')}" th:href="@{/admin.html}" class="il-header__dropdown-item">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M5 6h6M5 8.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                                <span th:text="#{nav.admin}">管理后台</span>
                            </a>
                            <hr class="il-header__dropdown-divider">
                            <a href="#" class="il-header__dropdown-item" data-fbk-open>
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M14 7.7a5.6 5.6 0 0 1-.6 2.5A5.7 5.7 0 0 1 8.4 13.3a5.6 5.6 0 0 1-2.5-.6L2 14l1.3-3.8A5.6 5.6 0 0 1 2.7 7.7a5.7 5.7 0 0 1 3.1-5.1 5.6 5.6 0 0 1 2.5-.6h.3A5.7 5.7 0 0 1 14 7.4v.3z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                <span th:text="#{nav.feedback}">意见反馈</span>
                            </a>
                            <a href="https://su-yu-s.github.io/iLink-cn/" target="_blank" rel="noopener noreferrer" class="il-header__dropdown-item">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 11V7.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="5.4" r="0.75" fill="currentColor"/></svg>
                                <span th:text="#{nav.about}">关于作者</span>
                            </a>
                            <hr class="il-header__dropdown-divider">
                            <a href="/api/logout" class="il-header__dropdown-item il-header__dropdown-item--danger" onclick="event.preventDefault(); logout();">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3M10 11l3-3-3-3M5.5 8H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                <span th:text="#{nav.logout}">退出登录</span>
                            </a>
                        </div>
                    </div>
                </th:block>

                <!-- Not logged in -->
                <th:block th:unless="${currentUser != null}">
                    <div class="il-header__auth">
                    <a href="/login.html" class="il-header__auth-link" th:text="#{nav.login}">登录</a>
                    <a href="/register.html" class="il-header__auth-btn" th:text="#{nav.register}">注册</a>
                    </div>
                </th:block>

                <!-- Mobile menu toggle -->
                <button class="il-header__language-switch" id="languageSwitch" type="button" th:text="#{language.switch}" th:attr="aria-label=#{language.switchLabel}">EN</button>
                <button class="il-header__menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="ilHeaderNav" th:attr="aria-label=#{header.drawer.open}">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 全站右下角悬浮入口：意见反馈 / 关于作者 -->
    <th:block th:replace="fragments/feedback-widget :: widget"></th:block>

    <!-- 全站右下角悬浮入口：AI 深度搜索（页面已挂载内嵌 AI 答疑实例时自动隐藏） -->
    <th:block th:replace="fragments/agentic-drawer :: widget"></th:block>

</th:block>
