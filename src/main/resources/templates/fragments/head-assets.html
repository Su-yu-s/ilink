<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  全站样式入口。用法：
  <head th:replace="fragments/head-assets :: core"></head>
  或带 Bootstrap：
  <head th:replace="fragments/head-assets :: core(bootstrap=true)"></head>
-->
<th:block th:fragment="core(bootstrap)">
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/favicon.svg(v=5)}" href="/favicon.svg?v=5">
    <!-- 字体使用系统默认：宋体（古诗词/标题）、微软雅黑（正文）、Times New Roman（西文）-->
    <link th:if="${bootstrap}" th:href="@{/lib/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/design-tokens.css}" rel="stylesheet">
    <link th:href="@{/css/effects.css}" rel="stylesheet">
    <link th:href="@{/css/components.css}" rel="stylesheet">
    <link th:href="@{/css/layout.css}" rel="stylesheet">
    <link th:href="@{/css/pages.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <th:block th:replace="~{fragments/head-assets :: redesign}"></th:block>
    <!-- 意见反馈 / 关于作者：悬浮入口与反馈详情页样式，放在最后避免与既有层冲突 -->
    <link th:href="@{/css/feedback.css}" rel="stylesheet">
</th:block>

<th:block th:fragment="auth">
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/favicon.svg(v=5)}" href="/favicon.svg?v=5">
    <!-- 字体使用系统默认：宋体（古诗词/标题）、微软雅黑（正文）、Times New Roman（西文）-->
    <link th:href="@{/css/design-tokens.css}" rel="stylesheet">
    <link th:href="@{/css/effects.css}" rel="stylesheet">
    <link th:href="@{/css/components.css}" rel="stylesheet">
    <link th:href="@{/css/layout.css}" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
    <th:block th:replace="~{fragments/head-assets :: redesign}"></th:block>
    <!-- 意见反馈 / 关于作者：悬浮入口与反馈详情页样式，放在最后避免与既有层冲突 -->
    <link th:href="@{/css/feedback.css}" rel="stylesheet">
</th:block>

<!-- Must be inserted after page-specific styles when a page has them. -->
<th:block th:fragment="redesign">
    <link th:href="@{/css/app-redesign.css}" rel="stylesheet">
</th:block>
</body>
</html>
