<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  意见反馈 · 关于作者 全局入口。
  用法：<th:block th:replace="fragments/feedback-widget :: widget"></th:block>
  已由 fragments/header.html 统一引入（覆盖 25 个页面），
  登录 / 注册 / 忘记密码三个认证页各自单独引入。

  反馈 Modal 复用 components.css 的 .il-modal-overlay 做居中与遮罩层，
  面板本身由 feedback.css 的 .fbk-* 实现。
-->
<th:block th:fragment="widget">
    <div class="fbk-fabs" id="fbkFabs">
        <button class="fbk-fab" id="fbkFabFeedback" type="button"
                data-fbk-open aria-label="意见反馈" title="意见反馈">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
        </button>
        <button class="fbk-fab" id="fbkFabAuthor" type="button"
                aria-label="关于作者" title="关于作者">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="M12 16v-4.5"/>
                <circle cx="12" cy="8.4" r="0.9" fill="currentColor" stroke="none"/>
            </svg>
        </button>
    </div>

    <!-- 关闭态由 .fbk-modal 的 display:none 承担，已足够移出无障碍树；
         额外用 aria-hidden 会在焦点仍在弹窗内时触发浏览器告警，故不设 -->
    <div class="il-modal-overlay fbk-modal" id="fbkModal">
        <div class="fbk-modal__panel" role="dialog" aria-modal="true" aria-labelledby="fbkModalTitle">
            <div class="fbk-modal__head">
                <div>
                    <p class="fbk-modal__eyebrow">iLink</p>
                    <h2 class="fbk-modal__title" id="fbkModalTitle">意见反馈</h2>
                    <p class="fbk-modal__subtitle">我们非常重视你的体验。提交后系统会立即推送到开发者微信，并生成专属页面备查。</p>
                </div>
                <button class="fbk-modal__close" id="fbkModalClose" type="button" aria-label="关闭">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="m6 6 12 12M18 6 6 18"/>
                    </svg>
                </button>
            </div>

            <form class="fbk-modal__body" id="fbkForm" novalidate>
                <div class="fbk-field">
                    <div class="fbk-field__top">
                        <span class="fbk-label">反馈类型 <span class="fbk-required">*</span></span>
                    </div>
                    <div class="fbk-types" id="fbkTypes" role="group" aria-label="反馈类型">
                        <button class="fbk-type is-active" type="button" data-type="BUG" aria-pressed="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 9v2m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
                            </svg>
                            <span>Bug 反馈</span>
                        </button>
                        <button class="fbk-type" type="button" data-type="FEATURE" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9.7 17h4.6M12 3v1m6.4 1.6-.7.7M21 12h-1M4 12H3m3.3-5.7-.7-.7m2.8 9.9a5 5 0 1 1 7.1 0l-.5.5A3.4 3.4 0 0 0 14 18.5V19a2 2 0 1 1-4 0v-.5c0-.9-.4-1.8-1-2.4l-.5-.5z"/>
                            </svg>
                            <span>功能建议</span>
                        </button>
                        <button class="fbk-type" type="button" data-type="UX" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4.3 6.3a4.5 4.5 0 0 0 0 6.4L12 20.4l7.7-7.7a4.5 4.5 0 0 0-6.4-6.4L12 7.6l-1.3-1.3a4.5 4.5 0 0 0-6.4 0z"/>
                            </svg>
                            <span>体验问题</span>
                        </button>
                        <button class="fbk-type" type="button" data-type="OTHER" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.4-4 8-9 8a9.9 9.9 0 0 1-4.3-1L3 20l1.4-3.7A8.9 8.9 0 0 1 3 12c0-4.4 4-8 9-8s9 3.6 9 8z"/>
                            </svg>
                            <span>其他</span>
                        </button>
                    </div>
                </div>

                <div class="fbk-field">
                    <div class="fbk-field__top">
                        <label class="fbk-label" for="fbkDesc">详细描述 <span class="fbk-required">*</span></label>
                        <span class="fbk-counter"><span id="fbkCounter">0</span> / 500</span>
                    </div>
                    <textarea class="fbk-textarea" id="fbkDesc" rows="4" maxlength="500"
                              placeholder="请详细描述你遇到的问题或建议。若涉及具体操作路径，可附上截图，描述越清晰处理越快。"></textarea>
                </div>

                <div class="fbk-grid">
                    <div class="fbk-col">
                        <div class="fbk-field__top">
                            <span class="fbk-label">上传截图 <span class="fbk-label__hint">(最多 5 张)</span></span>
                        </div>
                        <input type="file" id="fbkImages" accept="image/*" multiple class="fbk-visually-hidden">
                        <div class="fbk-dropzone" id="fbkDropzone" role="button" tabindex="0"
                             aria-label="点击或拖拽图片上传">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 16l4.6-4.6a2 2 0 0 1 2.8 0L16 16m-2-2 1.6-1.6a2 2 0 0 1 2.8 0L20 14M6 20h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/>
                            </svg>
                            <span class="fbk-dropzone__label">点击或拖拽图片上传</span>
                            <span class="fbk-dropzone__hint">支持 JPG、PNG、GIF，单张不超过 5MB</span>
                        </div>
                        <div class="fbk-previews" id="fbkPreviews"></div>
                    </div>

                    <div class="fbk-col">
                        <div class="fbk-field__top">
                            <label class="fbk-label" for="fbkContact">联系方式 <span class="fbk-label__hint">(选填)</span></label>
                        </div>
                        <div class="fbk-input-wrap">
                            <span class="fbk-input-wrap__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                     stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
                                    <path d="m3 7 8 5.5L20 7"/>
                                </svg>
                            </span>
                            <input class="fbk-input fbk-input--icon" id="fbkContact" type="text"
                                   maxlength="120" placeholder="邮箱或手机号" autocomplete="email">
                        </div>
                    </div>
                </div>

                <p class="fbk-error" id="fbkError" role="alert"></p>
            </form>

            <div class="fbk-modal__foot">
                <span class="fbk-note">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="2"/>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                    </svg>
                    截图仅用于排查问题，请勿上传含敏感信息的截图。
                </span>
                <button class="fbk-submit" id="fbkSubmit" type="submit" form="fbkForm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m22 2-7 20-4-9-9-4 20-7z"/>
                    </svg>
                    提交反馈
                </button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/feedback.js}" defer></script>
</th:block>
</body>
</html>
