<!DOCTYPE html>
<html lang="zh-CN" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - iLink</title>

    <th:block th:replace="fragments/head-assets :: core(bootstrap=true)"></th:block>
    <link th:href="@{/css/community-article.css}" rel="stylesheet">
    <link th:href="@{/css/portal-redesign.css}" rel="stylesheet">
    <link th:href="@{/lib/github-markdown.min.css}" rel="stylesheet">
    <link th:href="@{/css/md-editor.css}" rel="stylesheet">
</head>
<body data-app-page="community-article" class="ilink-page-bg community-article-page" th:attr="data-user-id=${currentUser != null ? currentUser.id : null}">
    <div th:replace="fragments/header :: header(${currentUser}, '')"></div>

    <div class="il-page-wrapper community-article-page">
        <div class="community-article-shell">
            <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>

            <nav class="community-article-breadcrumb" aria-label="breadcrumb">
                <a href="/community.html">交流社区</a>
                <span class="community-article-breadcrumb__sep" aria-hidden="true">›</span>
                <span id="breadcrumbCategory">文章</span>
                <span class="community-article-breadcrumb__sep" aria-hidden="true">›</span>
                <span id="breadcrumbTitle" class="community-article-breadcrumb__current">加载中…</span>
            </nav>

            <section class="community-article-state" id="articleLoadState" aria-live="polite" aria-busy="true">
                <div class="community-article-state__indicator" aria-hidden="true"></div>
                <p class="community-article-state__eyebrow">文章详情</p>
                <h1 class="community-article-state__title" id="articleLoadStateTitle">正在加载文章</h1>
                <p class="community-article-state__message" id="articleLoadStateMessage">正在获取正文与作者信息，请稍候…</p>
                <div class="community-article-state__actions">
                    <button type="button" class="il-btn il-btn-primary" id="articleRetryBtn" hidden>重新加载</button>
                    <a href="/community.html" class="il-btn">返回交流社区</a>
                </div>
            </section>

            <article class="community-article-card page-transition" id="articleContent" hidden>
                <header class="community-article-card__header">
                    <div class="community-article-card__header-top">
                        <h1 class="community-article__title" id="articleTitle">加载中…</h1>
                        <div class="community-article__header-actions" id="articleHeaderActions">
                            <button type="button" id="articleLikeBtn" class="il-feed-action community-article__action-btn" data-action="like" aria-label="点赞">
                                <svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;"><path d="M9 10V6.8c0-1.7 1.2-3.3 2.9-3.7l.7-.2c.7-.2 1.4.3 1.4 1v4.1H18c1.1 0 2 .9 2 2 0 .2 0 .4-.1.6l-1.5 6.2c-.2.9-1 1.6-2 1.6H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="10" width="4" height="9" rx="1" ry="1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                                <span id="articleLikeCount" class="il-feed-action__num community-article__action-num">0</span>
                            </button>
                            <button type="button" id="articleFavBtn" class="il-feed-action community-article__action-btn" data-action="favorite" aria-label="收藏">
                                <svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;"><path d="M12 3.8l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 17.2 6.7 19.9l1-5.8L3.5 10l5.9-.9L12 3.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                                <span id="articleFavCount" class="il-feed-action__num community-article__action-num">0</span>
                            </button>
                            <a href="/community.html" class="il-btn community-article__header-back">返回社区</a>
                            <button type="button" class="il-btn il-btn-danger-outline d-none" id="deleteArticleBtn">删除文章</button>
                        </div>
                    </div>
                    <div class="community-article__meta-stats" id="articleMetaStats">
                        <span id="articleMetaCategory" class="community-article__meta-item"></span>
                        <span class="community-article__meta-sep" aria-hidden="true">·</span>
                        <span class="community-article__meta-author">
                            <span id="articleMetaAvatar" class="community-article__avatar-slot community-article__avatar-slot--inline"></span>
                            <span id="articleAuthorName" class="community-article__meta-item">—</span>
                        </span>
                        <span class="community-article__meta-sep" aria-hidden="true">·</span>
                        <time id="articleMetaDate" class="community-article__meta-item"></time>
                        <span class="community-article__meta-sep" aria-hidden="true">·</span>
                        <span class="community-article__meta-item">阅读 <span id="articleViewCount">0</span></span>
                    </div>
                </header>
                <div class="community-article-card__body">
                    <div id="articleBody" class="community-article__content community-post-body markdown-body il-markdown-content"></div>
                    <div id="articleAttachments" class="community-article-attachments d-none"></div>
                </div>
            </article>

            <section class="community-article-comments page-transition" id="articleComments" aria-labelledby="commentsHeading" hidden>
                <header class="community-article-comments__header">
                    <h2 id="commentsHeading" class="community-article-comments__title">评论</h2>
                    <span class="community-article-comments__hint" id="commentCountHint"></span>
                </header>
                <div class="community-article-comments__body">
                    <!-- 评论编辑器：默认收起为「假输入框」，点击展开为编辑态 -->
                    <div class="il-comment-composer" id="commentComposer">
                        <div class="il-comment-composer__avatar" id="commentComposerAvatar" aria-hidden="true"></div>
                        <button type="button" class="il-comment-composer__trigger" id="commentComposerTrigger"
                                aria-label="写评论">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 20h9"></path>
                                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                            </svg>
                            <span>写下你的想法...</span>
                        </button>
                        <div class="il-comment-composer__editor" id="commentComposerEditor" hidden>
                            <textarea class="il-comment-composer__textarea" id="newCommentInput" rows="4"
                                      maxlength="2000" placeholder="分享你的经验、疑问或补充..."></textarea>
                            <div class="il-comment-composer__toolbar">
                                <div class="il-comment-composer__tools">
                                    <button type="button" class="il-comment-tool" data-tool="emoji" title="表情" aria-label="表情">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                             stroke-linecap="round" aria-hidden="true">
                                            <circle cx="12" cy="12" r="9"></circle>
                                            <path d="M8.5 14.5a4.2 4.2 0 0 0 7 0"></path>
                                            <circle cx="9.2" cy="9.8" r="0.9" fill="currentColor" stroke="none"></circle>
                                            <circle cx="14.8" cy="9.8" r="0.9" fill="currentColor" stroke="none"></circle>
                                        </svg>
                                    </button>
                                    <button type="button" class="il-comment-tool" data-tool="image" title="图片" aria-label="图片">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <rect x="3" y="4.5" width="18" height="15" rx="2.5"></rect>
                                            <circle cx="8.5" cy="9.5" r="1.4"></circle>
                                            <path d="M4 17l4.5-4.5L12 16l3-2.5 5 4.5"></path>
                                        </svg>
                                    </button>
                                    <button type="button" class="il-comment-tool" data-tool="code" title="代码" aria-label="代码">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <path d="M9 7l-5 5 5 5"></path>
                                            <path d="M15 7l5 5-5 5"></path>
                                        </svg>
                                    </button>
                                    <button type="button" class="il-comment-tool" data-tool="mention" title="提及" aria-label="提及">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <circle cx="12" cy="12" r="3.6"></circle>
                                            <path d="M15.6 8.4v4.9a3.1 3.1 0 0 0 6.2 0V12a9.8 9.8 0 1 0-4 7.9"></path>
                                        </svg>
                                    </button>
                                </div>
                                <div class="il-comment-composer__actions">
                                    <span class="il-comment-composer__count" id="commentCharCount" hidden></span>
                                    <button type="button" class="il-comment-cancel" id="cancelCommentBtn">取消</button>
                                    <button type="button" class="il-comment-submit" id="submitCommentBtn" disabled>发布</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="commentList" class="community-article-comment-list">
                        <p class="community-article-comment-list__empty">加载评论中…</p>
                    </div>
                    <div class="il-comment-more" id="commentMoreWrap" hidden>
                        <button type="button" class="il-comment-more__btn" id="loadMoreCommentsBtn">加载更多评论</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script th:src="@{/lib/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/ui-particles.js}"></script>
    <script th:src="@{/lib/marked.min.js}"></script>
    <script th:src="@{/lib/preview/purify.min.js}"></script>
    <script th:src="@{/js/community-article.js}"></script>
</body>
</html>
