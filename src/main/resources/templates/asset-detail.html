<!DOCTYPE html>
<html lang="zh-CN" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成果详情 - iLink</title>
    <th:block th:replace="fragments/head-assets :: core(bootstrap=true)"></th:block>
    <link th:href="@{/css/asset-detail.css}" rel="stylesheet">
    <link th:href="@{/lib/github-markdown.min.css}" rel="stylesheet">
    <link th:href="@{/css/md-editor.css}" rel="stylesheet">
    <link th:href="@{/css/portal-redesign.css}" rel="stylesheet">
</head>
<body data-app-page="asset-detail" class="ilink-page-bg asset-detail-page" th:attr="data-user-id=${currentUser != null ? currentUser.id : null}">
    <div th:replace="fragments/header :: header(${currentUser}, '')"></div>

    <div class="asset-detail-shell">
        <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>
        <nav class="asset-detail-breadcrumb" aria-label="breadcrumb">
            <a href="/gallery.html">成果展示</a>
            <span aria-hidden="true">›</span>
            <span id="assetBreadcrumbTitle">成果详情</span>
        </nav>

        <section class="asset-detail-state" id="assetDetailState" aria-live="polite" aria-busy="true">
            <div class="asset-detail-state__indicator" aria-hidden="true"></div>
            <p class="asset-detail-state__eyebrow">成果详情</p>
            <h1 class="asset-detail-state__title" id="assetDetailStateTitle">正在加载成果</h1>
            <p class="asset-detail-state__message" id="assetDetailStateMessage">正在获取成果内容与附件信息，请稍候…</p>
            <div class="asset-detail-state__actions">
                <button type="button" class="return-btn asset-detail-state__retry" id="assetDetailRetryBtn" hidden>重新加载</button>
                <a href="/gallery.html" class="return-btn asset-detail-state__back">返回成果展示</a>
            </div>
        </section>

        <article class="share-card page-transition" id="shareCard" hidden>
            <div class="card-grid">
                <section class="achievement-section">
                    <div class="detail-badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
                        <span>竞赛成果详情</span>
                        <span class="honor-badge" id="assetHonorBadge" hidden>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M8.21 13.89 7 22l5-3 5 3-1.21-8.11"/></svg>
                            <span id="assetHonorText"></span>
                        </span>
                    </div>
                    <h1 class="project-title" id="assetTitle">成果标题</h1>
                    <p class="project-subtitle" id="assetSubtitle" hidden></p>
                    <div class="project-sub">
                        <div class="author-info" id="assetAuthor">-</div>
                        <div class="meta-stats">
                            <div class="meta-item category-tag" id="assetCategoryWrap">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none"/></svg>
                                <span id="assetCategory">未分类</span>
                            </div>
                            <div class="meta-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                                <span id="assetCreateTime">-</span>
                            </div>
                        </div>
                        <div class="detail-actions" id="detailActions">
                            <button class="detail-action-btn" id="detailLikeBtn" data-action="like" data-id="">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                    <path d="M9 10V6.8c0-1.7 1.2-3.3 2.9-3.7l.7-.2c.7-.2 1.4.3 1.4 1v4.1H18c1.1 0 2 .9 2 2 0 .2 0 .4-.1.6l-1.5 6.2c-.2.9-1 1.6-2 1.6H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                                    <rect x="4" y="10" width="4" height="9" rx="1" stroke="currentColor" stroke-width="1.8"></rect>
                                </svg>
                                <span class="detail-action-num" id="detailLikeNum">0</span>
                            </button>
                            <button class="detail-action-btn" id="detailFavBtn" data-action="fav" data-id="">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                    <path d="M12 3.8l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 17.2 6.7 19.9l1-5.8L3.5 10l5.9-.9L12 3.8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                                </svg>
                                <span class="detail-action-num" id="detailFavNum">0</span>
                            </button>
                        </div>
                    </div>
                    <div class="insight-header desc-header">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 12c2-1 3-3 3-5"/><path d="M9 14c.5 1 1.5 1.5 3 1.5"/></svg>
                        <h2>成果描述</h2>
                    </div>
                    <div class="desc-box">
                        <div class="desc-text markdown-body il-markdown-content" id="assetDescLead">-</div>
                        <div class="desc-extra markdown-body il-markdown-content" id="assetDescExtra" hidden></div>
                    </div>
                </section>

                <section class="insight-section">
                    <div class="insight-header">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        <h2>竞赛心得 · 分享时刻</h2>
                    </div>
                    <div class="insight-content markdown-body il-markdown-content" id="assetInsight">
                        <p class="insight-empty">暂无分享内容，可在成果描述中用空行分隔「成果说明」与「参赛心得」。</p>
                    </div>
                </section>
            </div>

            <section class="full-width-attachment" id="assetAttachmentSection" hidden>
                <div class="attachment-area">
                    <div class="attachment-title">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg> 附件资料 · 成果共享
                    </div>
                    <div class="file-list" id="assetFiles"></div>
                    <p class="download-hint">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                        附件由发布者上传，仅供学习交流使用。
                    </p>
                </div>
            </section>

            <footer class="return-footer">
                <button type="button" class="return-btn" id="backBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> 返回成果展示
                </button>
            </footer>
        </article>
    </div>

    <script th:src="@{/lib/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/ui-particles.js}"></script>
    <script th:src="@{/lib/marked.min.js}"></script>
    <script th:src="@{/lib/preview/purify.min.js}"></script>
    <script th:src="@{/js/asset-detail.js}"></script>
</body>
</html>
