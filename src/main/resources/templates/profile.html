<!DOCTYPE html>
<html lang="zh-CN" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - iLink</title>

    <th:block th:replace="fragments/head-assets :: core(bootstrap=true)"></th:block>
    <link th:href="@{/css/profile.css}" rel="stylesheet">
    <link th:href="@{/css/team-invite.css}" rel="stylesheet">
</head>
<body data-profile-page="overview" class="ilink-page-bg"
      th:attr="data-user-id=${currentUser != null ? currentUser.id : null},data-user-role=${currentUser != null ? currentUser.role : null}">
    <div th:replace="fragments/header :: header(${currentUser}, '')"></div>

    <div class="il-page-wrapper">
        <div class="il-profile-layout">
            <div th:replace="~{fragments/profile-sidebar :: sidebar (active='overview')}"></div>

            <!-- Content -->
            <div class="il-profile-content">
                <!-- Profile Card -->
                <div class="il-profile-card" id="profileOverviewCard">
                    <div class="il-profile-avatar">
                        <img th:if="${currentUser.avatar != null && !currentUser.avatar.isEmpty()}"
                             th:src="${currentUser.avatar}"
                             th:alt="${currentUser.realName ?: currentUser.username}"
                             onerror="this.style.display='none'; this.parentElement.querySelector('.il-profile-avatar-fallback').style.display='flex';">
                        <span class="il-profile-avatar-fallback"
                              th:unless="${currentUser.avatar != null && !currentUser.avatar.isEmpty()}"
                              th:text="${currentUser.username != null && !currentUser.username.isEmpty() ? #strings.substring(currentUser.username, 0, 1) : '用'}">用</span>
                        <span class="il-profile-avatar-fallback"
                              th:if="${currentUser.avatar != null && !currentUser.avatar.isEmpty()}"
                              style="display:none;"
                              th:text="${currentUser.username != null && !currentUser.username.isEmpty() ? #strings.substring(currentUser.username, 0, 1) : '用'}">用</span>
                    </div>
                    <div class="il-profile-info">
                        <h1 class="il-profile-name" th:text="${currentUser.realName ?: currentUser.username}">用户</h1>
                        <span class="il-profile-role" th:text="${currentUser.role == 'TEACHER' ? '认证导师' : (currentUser.role == 'ADMIN' ? '管理员' : '学生')}">学生</span>
                        <div class="il-profile-meta">
                            <span class="il-profile-meta-item">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                                <span th:text="${currentUser.email ?: '未设置邮箱'}">邮箱</span>
                            </span>
                            <span class="il-profile-meta-item">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                                    <circle cx="12" cy="10" r="3"/>
                                </svg>
                                <span id="profileInstitutionText" th:text="${currentUser.school ?: '未设置学校'}">学校</span>
                            </span>
                        </div>
                        <p class="il-profile-bio" th:text="${currentUser.bio ?: '还没有个人简介，去编辑一下吧~'}">个人简介</p>
                    </div>
                    <div class="il-profile-actions">
                        <a href="/profile-edit.html" class="il-btn il-btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                            编辑资料
                        </a>
                    </div>
                </div>

                <section class="il-section-card il-teacher-summary" id="teacherProfileSummary" hidden aria-labelledby="teacherProfileSummaryTitle">
                    <div class="il-section-header">
                        <div>
                            <h2 class="il-section-title" id="teacherProfileSummaryTitle">导师资料</h2>
                            <p class="il-section-subtitle">展示给学生的指导信息</p>
                        </div>
                        <a class="il-btn il-btn-primary" id="teacherProfileDetailLink" href="/teacher-wall.html">查看导师主页</a>
                    </div>
                    <dl class="il-teacher-summary__grid">
                        <div><dt>专业领域</dt><dd id="teacherSummaryExpertise">未设置</dd></div>
                        <div><dt>职称</dt><dd id="teacherSummaryTitle">未设置</dd></div>
                        <div><dt>研究方向</dt><dd id="teacherSummaryResearch">未设置</dd></div>
                        <div><dt>代表项目</dt><dd id="teacherSummaryProjects">未设置</dd></div>
                    </dl>
                </section>

                <section class="il-section-card il-teacher-competition-overview" id="teacherCompetitionOverview" hidden
                         aria-labelledby="teacherCompetitionOverviewTitle">
                    <div class="il-section-header">
                        <div>
                            <h2 class="il-section-title" id="teacherCompetitionOverviewTitle">竞赛概览</h2>
                            <p class="il-section-subtitle">集中查看公开成果与荣誉奖项</p>
                        </div>
                    </div>
                    <div class="il-teacher-competition-overview__grid">
                        <section class="il-teacher-competition-block" aria-labelledby="teacherCompetitionAssetsTitle">
                            <div class="il-teacher-competition-block__header">
                                <h3 id="teacherCompetitionAssetsTitle">竞赛成果</h3>
                                <a href="/gallery.html">查看成果展示</a>
                            </div>
                            <div id="teacherCompetitionAssets" class="il-teacher-competition-list">
                                <p class="il-teacher-competition-empty">正在加载…</p>
                            </div>
                        </section>
                        <section class="il-teacher-competition-block" aria-labelledby="teacherCompetitionHonorsTitle">
                            <div class="il-teacher-competition-block__header">
                                <h3 id="teacherCompetitionHonorsTitle">荣誉奖项</h3>
                                <a href="/profile-honors.html">管理奖项</a>
                            </div>
                            <div id="teacherCompetitionHonors" class="il-teacher-competition-list">
                                <p class="il-teacher-competition-empty">正在加载…</p>
                            </div>
                        </section>
                    </div>
                </section>

                <!-- Activity Section -->
                <div class="il-section-card" id="activitySectionCard">
                    <div class="il-section-header">
                        <div>
                            <h2 class="il-section-title" id="activitySectionTitle">我的活动</h2>
                            <p class="il-section-subtitle" id="activitySectionSubtitle">管理你发布和申请的组队</p>
                        </div>
                        <a class="il-btn il-btn-primary" id="createTeamBtn" href="/team-publish.html"
                           style="display: none;">新建团队</a>
                    </div>

                    <div class="il-tabs" id="activityTabs">
                        <button class="il-tab active" id="tab-teams" type="button">我带领的队伍</button>
                        <button class="il-tab" id="tab-applications" type="button">我申请的队伍</button>
                    </div>

                    <div id="content-teams" class="il-tab-panel">
                        <div class="il-empty-state">
                            <div class="il-empty-icon">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                    <circle cx="9" cy="7" r="4"/>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                                </svg>
                            </div>
                            <p class="il-empty-title">还没有组队</p>
                            <p class="il-empty-text">去组队大厅看看，找到志同道合的伙伴</p>
                        </div>
                    </div>

                    <div id="content-applications" class="il-tab-panel" style="display: none;">
                        <div class="il-empty-state">
                            <div class="il-empty-icon">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                    <polyline points="22 4 12 14.01 9 11.01"/>
                                </svg>
                            </div>
                            <p class="il-empty-title">还没有申请</p>
                            <p class="il-empty-text">申请加入感兴趣的团队吧</p>
                        </div>
                    </div>

                    <div id="content-teams-joined" class="il-tab-panel" style="display: none;">
                        <div id="joinedTeamsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="fragments/team-invite-modal :: modal"></div>

    <script th:src="@{/lib/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/team-invite.js}"></script>
    <script th:src="@{/js/profile.js}"></script>
    <script>
(function() {
    function switchTab(tab) {
        var tabs = document.querySelectorAll('.il-tab');
        for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
        document.getElementById('tab-' + tab).classList.add('active');
        document.getElementById('content-teams').style.display = tab === 'teams' ? 'block' : 'none';
        document.getElementById('content-applications').style.display = tab === 'applications' ? 'block' : 'none';
    }

    function isTeacher() {
        return document.body.getAttribute('data-user-role') === 'TEACHER';
    }

    function setHidden(element, hidden) {
        if (!element) return;
        element.hidden = hidden;
        element.setAttribute('aria-hidden', hidden ? 'true' : 'false');
    }

    function applyProfileHashView() {
        var hash = window.location.hash || '#';
        var teamView = hash === '#teams';
        var teacher = isTeacher();
        var navItems = document.querySelectorAll('.il-profile-nav-item');
        var navMap = { '#teams': '我的团队', '#': '竞赛概览' };
        var label = navMap[hash] || navMap['#'];

        navItems.forEach(function(item) {
            var span = item.querySelector('span');
            item.classList.toggle('active', !!span && span.textContent.trim() === label);
        });

        var activityCard = document.getElementById('activitySectionCard');
        var profileCard = document.getElementById('profileOverviewCard');
        var teacherSummary = document.getElementById('teacherProfileSummary');
        var competitionOverview = document.getElementById('teacherCompetitionOverview');
        var title = document.getElementById('activitySectionTitle');
        var subtitle = document.getElementById('activitySectionSubtitle');
        var activityTabs = document.getElementById('activityTabs');
        var teams = document.getElementById('content-teams');
        var applications = document.getElementById('content-applications');
        var joined = document.getElementById('content-teams-joined');
        var createButton = document.getElementById('createTeamBtn');

        if (teamView) {
            setHidden(activityCard, false);
            if (teacher) {
                setHidden(profileCard, true);
                setHidden(competitionOverview, true);
                setHidden(teacherSummary, true);
            }
            if (title) title.textContent = '我的团队';
            if (subtitle) subtitle.textContent = '管理你创建或参与的项目';
            if (activityTabs) activityTabs.style.display = 'none';
            if (teams) teams.style.display = 'none';
            if (applications) applications.style.display = 'none';
            if (joined) joined.style.display = 'block';
            if (createButton) createButton.style.display = '';
            if (typeof renderJoinedTeams === 'function') renderJoinedTeams();
            return;
        }

        if (teacher) {
            setHidden(profileCard, false);
            setHidden(activityCard, true);
            setHidden(competitionOverview, false);
            if (teacherSummary && teacherSummary.getAttribute('data-profile-loaded') === 'true') {
                setHidden(teacherSummary, false);
            }
            return;
        }

        setHidden(profileCard, false);
        setHidden(activityCard, false);
        if (title) title.textContent = '我的活动';
        if (subtitle) subtitle.textContent = '管理你发布和申请的组队';
        if (activityTabs) activityTabs.style.display = 'flex';
        if (joined) joined.style.display = 'none';
        if (teams) teams.style.display = 'block';
        if (applications) applications.style.display = 'none';
        if (createButton) createButton.style.display = 'none';
    }

    window.applyProfileHashView = applyProfileHashView;

    document.addEventListener('DOMContentLoaded', function() {
        var tabs = document.querySelectorAll('.il-tab');
        for (var i = 0; i < tabs.length; i++) {
            (function(tab) {
                tab.addEventListener('click', function() {
                    var tabName = this.id === 'tab-teams' ? 'teams' : 'applications';
                    switchTab(tabName);
                });
            })(tabs[i]);
        }

        applyProfileHashView();
        window.addEventListener('hashchange', applyProfileHashView);
    });
})();
    </script>
</body>
</html>
