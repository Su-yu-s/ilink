<!DOCTYPE html>
<html lang="zh-CN" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>iLink</title>
    <th:block th:replace="fragments/head-assets :: core(bootstrap=false)"></th:block>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('id') || params.get('teamId');
            var target = id ? '/team-space.html?id=' + encodeURIComponent(id) : '/profile.html#teams';
            // replace：不产生历史记录，用户按"返回"不会回到这个中转页
            window.location.replace(target);
        })();
    </script>
    <style>
        /* 极端情况下（脚本被禁用/跳转延迟）的兜底：不显示任何可见内容 */
        html, body { margin: 0; height: 100%; background: #fff; }
    </style>
</head>
<body data-app-page="team-workspace" class="ilink-page-bg">
    <!-- 纯中转页：正常情况下在渲染前已完成跳转，无可见内容 -->
    <noscript>
        <main class="il-page-wrapper">
            <section class="il-empty-state" style="max-width: 560px; margin: 120px auto;">
                <h1>正在进入团队空间</h1>
                <p>浏览器未启用 JavaScript，请点击下方链接继续。</p>
                <a class="il-btn il-btn-primary" href="/profile.html#teams">返回我的小队</a>
            </section>
        </main>
    </noscript>
</body>
</html>
