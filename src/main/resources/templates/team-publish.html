<!DOCTYPE html>
<html lang="zh-CN" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布组队需求 | iLink</title>
    <th:block th:replace="fragments/head-assets :: core(bootstrap=true)"></th:block>
    <link th:href="@{/css/portal-redesign.css}" rel="stylesheet">
</head>
<body data-app-page="team-publish" class="ilink-page-bg" th:attr="data-user-id=${currentUser != null ? currentUser.id : null}">

    <div th:replace="fragments/header :: header(${currentUser}, 'publish')"></div>

    <div class="il-page-wrapper">
        <!-- 页面头部 -->
        <div class="il-hero tp-hero">
            <p class="il-hero-eyebrow">团队协作</p>
            <h1 class="il-hero-title">发布组队需求</h1>
            <p class="il-hero-desc">填写项目信息，寻找合适的队友。清晰的描述能吸引更多匹配的参与者。</p>
        </div>

        <form id="publishForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="il-surface tp-card">
                <!-- 分组一：基本信息 -->
                <section class="tp-section">
                    <h2 class="tp-section__title">基本信息</h2>

                    <div class="tp-field">
                        <label for="title" class="il-form-label">标题 <span class="tp-req">*</span></label>
                        <input type="text" class="il-form-input" id="title" maxlength="100" placeholder="用一句话概括你的团队需求" required>
                    </div>

                    <div class="tp-field">
                        <div class="tp-label-row">
                            <label for="description" class="il-form-label">项目描述 <span class="tp-req">*</span></label>
                            <span class="tp-counter" id="descCounter">0 / 500</span>
                        </div>
                        <textarea class="il-form-input" id="description" rows="7" maxlength="500" placeholder="描述项目背景、目标、进展阶段，以及你希望队友做什么…背景和目标写清楚，更容易匹配到合适的人" required></textarea>
                    </div>
                </section>

                <!-- 分组二：队伍设置 -->
                <section class="tp-section">
                    <h2 class="tp-section__title">队伍设置</h2>

                    <div class="tp-field">
                        <label class="il-form-label" id="categoryLabel">分类 <span class="tp-req">*</span></label>
                        <!-- 单选芯片：真正的值放在隐藏域里，提交契约与原来的 select 完全一致 -->
                        <input type="hidden" id="category" value="">
                        <div class="tp-chips" id="categoryChips" role="radiogroup" aria-labelledby="categoryLabel">
                            <button type="button" class="tp-chip" data-value="技术开发" role="radio" aria-checked="false">技术开发</button>
                            <button type="button" class="tp-chip" data-value="创意设计" role="radio" aria-checked="false">创意设计</button>
                            <button type="button" class="tp-chip" data-value="市场营销" role="radio" aria-checked="false">市场营销</button>
                            <button type="button" class="tp-chip" data-value="学术研究" role="radio" aria-checked="false">学术研究</button>
                            <button type="button" class="tp-chip" data-value="竞赛协作" role="radio" aria-checked="false">竞赛协作</button>
                        </div>
                    </div>

                    <div class="tp-grid tp-grid--2">
                        <div class="tp-field">
                            <label for="memberCount" class="il-form-label">所需人数 <span class="tp-req">*</span></label>
                            <input type="number" class="il-form-input" id="memberCount" min="1" max="50" placeholder="2" required>
                        </div>
                        <div class="tp-field">
                            <label for="skills" class="il-form-label">所需技能 <span class="tp-optional">选填</span></label>
                            <input type="text" class="il-form-input" id="skills" placeholder="多个技能用逗号分隔，例如：Java, Python、UI设计">
                        </div>
                    </div>
                </section>

                <!-- 分组三：时间安排 -->
                <section class="tp-section">
                    <div class="tp-label-row">
                        <h2 class="tp-section__title" id="deadlineLabel">截止日期 <span class="tp-optional">选填</span></h2>
                        <span class="tp-label-note" id="deadlineNote">一直开放招募</span>
                    </div>
                    <div class="tp-chips tp-chips--period" id="deadlineChips" role="radiogroup" aria-labelledby="deadlineLabel">
                        <button type="button" class="tp-chip" data-period="long" role="radio" aria-checked="false">长期有效</button>
                        <button type="button" class="tp-chip" data-period="week" role="radio" aria-checked="false">一周内</button>
                        <button type="button" class="tp-chip" data-period="month" role="radio" aria-checked="false">一个月内</button>
                        <button type="button" class="tp-chip" data-period="custom" role="radio" aria-checked="false">自定义</button>
                    </div>
                    <div class="tp-field tp-field--custom-date" id="customDateField" hidden>
                        <label for="deadline" class="il-form-label">选择日期</label>
                        <input type="date" class="il-form-input" id="deadline">
                    </div>
                    <!-- 提交给后端的就是这个值：长期有效时为空串 -->
                    <input type="hidden" id="deadlineValue" value="">
                </section>

                <!-- 底部操作区 -->
                <div class="tp-actions">
                    <a href="/team-market.html" class="il-btn il-btn-secondary" id="cancelPublishBtn">取消</a>
                    <button type="submit" class="il-btn il-btn-primary">
                        <svg class="il-btn__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span class="tp-submit-text">发布需求</span>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script th:src="@{/lib/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/team-publish.js}"></script>
</body>
</html>
