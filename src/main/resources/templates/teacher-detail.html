<!DOCTYPE html>
<html lang="zh-CN" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导师详情 - iLink</title>

    <th:block th:replace="fragments/head-assets :: core(bootstrap=true)"></th:block>
    <link th:href="@{/css/teacher-detail.css}" rel="stylesheet">
    <link th:href="@{/css/portal-redesign.css}" rel="stylesheet">
    <link th:href="@{/css/detail-refresh.css}" rel="stylesheet">
    <link th:href="@{/css/teacher-detail-v2.css}" rel="stylesheet">
</head>
<body data-app-page="teacher-detail" class="ilink-page-bg" th:attr="data-user-id=${currentUser != null ? currentUser.id : null}">
    <div th:replace="fragments/header :: header(${currentUser}, '')"></div>

    <main class="main-content teacher-detail-main">
        <canvas id="particleCanvas" class="particle-canvas"></canvas>

        <div class="teacher-detail-shell">
            <a href="/teacher-wall.html" id="backBtn" class="teacher-detail-back">← 返回导师招贤</a>

            <section class="detail-load-state" id="teacherDetailState" aria-live="polite" aria-busy="true">
                <div class="detail-load-state__indicator" aria-hidden="true"></div>
                <p class="detail-load-state__eyebrow">导师详情</p>
                <h1 class="detail-load-state__title" id="teacherDetailStateTitle">正在加载导师信息</h1>
                <p class="detail-load-state__message" id="teacherDetailStateMessage">正在连接导师服务，请稍候…</p>
                <div class="detail-load-state__actions">
                    <button type="button" class="il-btn il-btn--primary" id="teacherDetailRetryBtn" hidden>重新加载</button>
                    <a href="/teacher-wall.html" class="il-btn">返回导师招贤</a>
                </div>
            </section>

            <article class="tdm-page page-transition" id="teacherDetailContent" hidden>
                <header class="tdm-header">
                    <div id="teacherHeaderAvatar" class="tdm-avatar" aria-hidden="false"></div>
                    <div class="tdm-head">
                        <div class="tdm-title-row">
                            <h1 class="tdm-name" id="teacherName">导师姓名</h1>
                            <span class="tdm-suffix" id="teacherNameSuffix" hidden>导师</span>
                            <span class="tdm-cert">
                                <svg class="tdm-cert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                认证导师
                            </span>
                        </div>
                        <p class="tdm-sub"><span id="teacherMajor">-</span><span class="tdm-sub__dot">·</span><span id="teacherTitle">-</span></p>
                    </div>
                </header>

                <div class="tdm-body">
                    <div class="tdm-stats">
                        <div class="tdm-stat">
                            <span class="tdm-stat__label">申请时间</span>
                            <span class="tdm-stat__value tdm-stat__value--sm" id="applicationTime">-</span>
                        </div>
                        <div class="tdm-stat">
                            <span class="tdm-stat__label">已通过合作</span>
                            <span class="tdm-stat__value" id="teacherApprovedProjects">0</span>
                        </div>
                        <div class="tdm-stat">
                            <span class="tdm-stat__label">公开成果</span>
                            <span class="tdm-stat__value" id="teacherPublicAssets">0</span>
                        </div>
                    </div>

                    <section class="tdm-section">
                        <h2 class="tdm-section__title">
                            <svg class="tdm-section__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            个人简介
                        </h2>
                        <div class="tdm-section__content"><p id="teacherBio">-</p></div>
                    </section>

                    <section class="tdm-section">
                        <h2 class="tdm-section__title">
                            <svg class="tdm-section__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                            研究方向
                        </h2>
                        <div class="tdm-section__content"><p id="teacherResearch">-</p></div>
                    </section>

                    <section class="tdm-section" id="teacherProjectsRow" hidden>
                        <h2 class="tdm-section__title">
                            <svg class="tdm-section__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                            代表项目
                        </h2>
                        <div class="tdm-section__content"><p id="teacherProjects">-</p></div>
                    </section>
                </div>

                <section id="projectApplySection" class="tdm-apply" aria-labelledby="projectApplyHeading">
                    <h2 id="projectApplyHeading" class="tdm-apply__title">申请合作 / 课题意向</h2>
                    <p id="projectApplyHint" class="tdm-apply__desc">登录后可向该导师提交合作意向说明。</p>
                    <div class="tdm-input">
                        <textarea id="projectApplyMessage" class="tdm-input__field" rows="5" maxlength="500"
                            aria-label="合作意向说明"
                            placeholder="请简述您的背景、技能与希望参与的方向（选填）"></textarea>
                        <span class="tdm-input__count"><span id="tdCharCount">0</span> / 500</span>
                    </div>
                    <div class="tdm-apply__actions">
                        <span class="tdm-apply__note">提交后，导师将在 3-5 个工作日内处理您的申请。</span>
                        <button type="button" id="projectApplyBtn" class="tdm-submit">提交申请</button>
                    </div>
                    <p id="projectApplyStatus" class="tdm-apply__status" role="status"></p>
                </section>
            </article>

                    <section id="teacherPendingSection" class="teacher-detail__apply teacher-detail__pending td-standalone-card" aria-labelledby="teacherPendingHeading" hidden>
                        <div class="teacher-detail__pending-heading">
                            <div>
                                <h2 id="teacherPendingHeading" class="teacher-detail__section-label">待处理合作申请</h2>
                                <p class="teacher-detail__apply-hint">这里展示学生向您提交的合作意向，可直接通过或拒绝。</p>
                            </div>
                            <span class="teacher-detail__pending-count" id="teacherPendingCount">0</span>
                        </div>
                        <div class="teacher-detail__pending-list" id="teacherPendingList" aria-live="polite"></div>
                    </section>
        </div>
    </main>

    <script th:src="@{/lib/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/ui-particles.js}"></script>
    <script th:src="@{/js/teacher-detail.js}"></script>
    <script th:src="@{/js/detail-refresh.js}"></script>
</body>
</html>
