<!DOCTYPE html>
<html lang="zh-CN" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - iLink</title>

    <th:block th:replace="fragments/head-assets :: core(bootstrap=true)"></th:block>
    <link th:href="@{/css/profile.css}" rel="stylesheet">
    <link th:href="@{/css/profile-refresh.css}" rel="stylesheet">
</head>
<body data-profile-page="password" class="ilink-page-bg" th:attr="data-user-id=${currentUser != null ? currentUser.id : null}">
    <div th:replace="fragments/header :: header(${currentUser}, '')"></div>

    <div class="il-page-wrapper">
        <div class="il-profile-layout">
            <div th:replace="~{fragments/profile-sidebar :: sidebar (active='password')}"></div>

            <div class="il-profile-content">
                <div class="il-section-card">
                    <div class="il-section-header">
                        <div>
                            <h2 class="il-section-title">修改密码</h2>
                            <p class="il-section-subtitle">定期更换密码有助于保护账号安全</p>
                        </div>
                    </div>

<form id="passwordForm" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="pf-pwd-group">
                            <label class="form-label" for="oldPassword">旧密码 <span class="text-danger">*</span></label>
                            <div class="pf-pwd-field">
                                <input type="password" class="il-form-input" id="oldPassword" autocomplete="current-password" required placeholder="请输入当前密码">
                                <button type="button" class="pf-pwd-toggle" data-target="oldPassword" aria-label="显示密码"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2.04 12.32a1 1 0 0 1 0-.64C3.42 7.51 7.36 4.5 12 4.5s8.58 3.01 9.96 7.18a1 1 0 0 1 0 .64C20.58 16.49 16.64 19.5 12 19.5s-8.58-3.01-9.96-7.18z'/><circle cx='12' cy='12' r='3'/></svg></button>
                            </div>
                            <div class="invalid-feedback">请输入旧密码</div>
                        </div>

                        <div class="pf-pwd-group">
                            <label class="form-label" for="newPassword">新密码 <span class="text-danger">*</span></label>
                            <div class="pf-pwd-field">
                                <input type="password" class="il-form-input" id="newPassword" autocomplete="new-password" required minlength="8" placeholder="至少 8 个字符（需含大小写字母和数字）">
                                <button type="button" class="pf-pwd-toggle" data-target="newPassword" aria-label="显示密码"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2.04 12.32a1 1 0 0 1 0-.64C3.42 7.51 7.36 4.5 12 4.5s8.58 3.01 9.96 7.18a1 1 0 0 1 0 .64C20.58 16.49 16.64 19.5 12 19.5s-8.58-3.01-9.96-7.18z'/><circle cx='12' cy='12' r='3'/></svg></button>
                            </div>
                            <div class="pf-strength" id="pfStrength">
                                <div class="pf-strength__track"><div class="pf-strength__bar" id="pfStrengthBar"></div></div>
                                <span class="pf-strength__text" id="pfStrengthText"></span>
                            </div>
                            <div class="invalid-feedback">新密码至少需要 8 个字符</div>
                        </div>

                        <div class="pf-pwd-group">
                            <label class="form-label" for="confirmPassword">确认新密码 <span class="text-danger">*</span></label>
                            <div class="pf-pwd-field">
                                <input type="password" class="il-form-input" id="confirmPassword" autocomplete="new-password" required minlength="8" placeholder="再次输入新密码">
                                <button type="button" class="pf-pwd-toggle" data-target="confirmPassword" aria-label="显示密码"><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2.04 12.32a1 1 0 0 1 0-.64C3.42 7.51 7.36 4.5 12 4.5s8.58 3.01 9.96 7.18a1 1 0 0 1 0 .64C20.58 16.49 16.64 19.5 12 19.5s-8.58-3.01-9.96-7.18z'/><circle cx='12' cy='12' r='3'/></svg></button>
                                <span class="pf-match-msg">两次输入的密码不一致</span>
                            </div>
                            <div class="invalid-feedback">两次输入的密码不一致</div>
                        </div>

                        <div class="d-flex align-items-center gap-4 pt-4 mt-4">
                            <button type="submit" class="il-btn il-btn-primary" id="passwordSubmitBtn">确认修改</button>
                            <p class="mb-0 text-muted pf-pwd-note" style="font-size: 13px;">修改成功后需要重新登录。</p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/lib/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/profile.js}"></script>
    <script th:src="@{/js/profile-password.js}"></script>
    <script th:src="@{/js/profile-refresh.js}"></script>
</body>
</html>
