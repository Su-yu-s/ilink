<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" class="ilink-app">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 - iLink</title>
    <th:block th:replace="fragments/head-assets :: core(bootstrap=true)"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.0/github-markdown.min.css" rel="stylesheet" crossorigin="anonymous">
    <link th:href="@{/css/md-editor.css}" rel="stylesheet">
    <link th:href="@{/css/profile.css}" rel="stylesheet">
    <link th:href="@{/css/publishing-workspace.css}" rel="stylesheet">
</head>
<body data-profile-page="posts" data-publishing-workspace="article">
<div th:replace="~{fragments/header :: header(${currentUser}, 'community')}"></div>

<main class="publishing-workspace">
    <!-- 通栏次级标题栏 -->
    <header class="publishing-workspace__topbar">
        <div class="publishing-workspace__topbar-inner">
            <div class="publishing-workspace__topbar-left">
                <a class="publishing-workspace__back" href="/community.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                    返回社区
                </a>
                <span class="publishing-workspace__topbar-sep">|</span>
                <span class="publishing-workspace__topbar-name" id="pageTitle">写文章</span>
            </div>
            <div class="publishing-workspace__actions">
                <span class="publishing-workspace__status" id="saveStatus">尚未保存</span>
                <a class="il-btn-ghost" id="editPreviewLink" href="#" hidden>预览公开页</a>
                <button class="il-btn-primary" id="editSaveBtn" type="button">
                    <span id="editSaveBtnLabel">发布文章</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="publishing-workspace__body">
        <!-- 左侧编辑主卡 -->
        <section class="publishing-workspace__editor">
            <div class="publishing-workspace__title-block">
                <input class="publishing-workspace__title-input" id="editTitle" type="text" maxlength="100" placeholder="输入文章标题..." autocomplete="off">
            </div>

            <div class="ws-toolbar-row">
                <div class="md-toolbar" role="toolbar" aria-label="Markdown 工具栏">
                    <button class="md-toolbar-btn" type="button" data-action="bold" title="加粗 (Ctrl+B)" aria-label="加粗">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/></svg>
                    </button>
                    <button class="md-toolbar-btn" type="button" data-action="italic" title="斜体 (Ctrl+I)" aria-label="斜体">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
                    </button>
                    <button class="md-toolbar-btn" type="button" data-action="strikethrough" title="删除线" aria-label="删除线">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
                    </button>
                    <button class="md-toolbar-btn" type="button" data-action="code" title="代码块" aria-label="代码块">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    </button>
                    <span class="md-toolbar-sep" aria-hidden="true"></span>
                    <button class="md-toolbar-btn" type="button" data-action="h2" title="二级标题">H2</button>
                    <button class="md-toolbar-btn" type="button" data-action="h3" title="三级标题">H3</button>
                    <span class="md-toolbar-sep" aria-hidden="true"></span>
                    <button class="md-toolbar-btn" type="button" data-action="ul" title="无序列表" aria-label="无序列表">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    </button>
                    <button class="md-toolbar-btn" type="button" data-action="ol" title="有序列表" aria-label="有序列表">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
                    </button>
                    <button class="md-toolbar-btn" type="button" data-action="quote" title="引用" aria-label="引用">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 6C5 6 3 8 3 10.5c0 2.3 1.7 4 3.9 4-.2 1.5-1.2 2.6-2.6 3.1L5 19.4c3-.8 5-3.3 5-6.9V10.5C10 8 9 6 7.5 6Zm9 0C14 6 12 8 12 10.5c0 2.3 1.7 4 3.9 4-.2 1.5-1.2 2.6-2.6 3.1l.7 1.8c3-.8 5-3.3 5-6.9V10.5C19 8 18 6 16.5 6Z"/></svg>
                    </button>
                    <span class="md-toolbar-sep" aria-hidden="true"></span>
                    <button class="md-toolbar-btn" type="button" data-action="link" title="插入链接 (Ctrl+K)" aria-label="插入链接">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    </button>
                    <button class="md-toolbar-btn" type="button" data-action="image" title="插入图片" aria-label="插入图片">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>
                    </button>
                    <button class="md-toolbar-btn" type="button" data-action="table" title="插入表格" aria-label="插入表格">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                    </button>
                    <button class="md-toolbar-btn" type="button" data-action="hr" title="分割线" aria-label="分割线">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
                <div class="md-mode-bar" id="mdModeBar" role="group" aria-label="编辑视图">
                    <button class="md-mode-btn active" type="button" data-mode="split">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                        分栏
                    </button>
                    <button class="md-mode-btn" type="button" data-mode="edit">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                        编辑
                    </button>
                    <button class="md-mode-btn" type="button" data-mode="preview">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        预览
                    </button>
                </div>
            </div>

            <div class="md-pane-wrap split" id="mdPaneWrap">
                <div class="md-edit-pane" id="mdEditPane">
                    <textarea id="mdEditor" spellcheck="false" placeholder="在这里开始写作，支持 Markdown 语法..."></textarea>
                </div>
                <div class="md-divider visible" id="mdDivider" aria-hidden="true"></div>
                <div class="md-preview-pane" id="mdPreviewPane">
                    <div class="markdown-body" id="mdPreview">
                        <p style="color:#d1d5db;font-style:italic;text-align:center;margin-top:80px;">开始输入，这里会实时预览你的文章...</p>
                    </div>
                </div>
                <div class="ws-drag-mask" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
                    <b>松手即可插入图片或附件</b>
                    <span>图片将自动上传并插入正文</span>
                </div>
            </div>

            <div class="publishing-workspace__editor-footer">
                <div class="ws-stats">
                    <span>字数：<b id="wsWordCount">0</b></span>
                    <i class="ws-dot" aria-hidden="true"></i>
                    <span>行数：<b id="wsLineCount">0</b></span>
                    <i class="ws-dot" aria-hidden="true"></i>
                    <span>预计阅读：<b id="wsReadTime">1</b> 分钟</span>
                </div>
                <div>支持 Markdown 语法</div>
            </div>
        </section>

        <!-- 右侧栏 -->
        <aside class="publishing-workspace__sidebar">
            <section class="publishing-workspace__panel">
                <div class="publishing-workspace__panel-heading">
                    <h2>文章设置</h2>
                </div>
                <div class="publishing-workspace__field">
                    <label class="form-label" for="editCategory">发布到分类 <span>*</span></label>
                    <select class="form-select" id="editCategory">
                        <option value="general">综合交流</option>
                        <option value="tech">技术分享</option>
                        <option value="competition">竞赛经验</option>
                        <option value="resource">资料共享</option>
                    </select>
                </div>
            </section>

            <section class="publishing-workspace__panel">
                <div class="publishing-workspace__panel-heading">
                    <h2>
                        附件
                        <span class="ws-panel-heading-note">最多 10 个，单个不超过 20MB</span>
                    </h2>
                </div>
                <button class="ws-dropzone" id="editAddAttachmentBtn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span class="ws-dropzone__main" id="editAddAttachmentLabel">点击或拖拽文件上传</span>
                </button>
                <input class="d-none" id="editAttachmentInput" type="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,.zip,.rar,.7z,.exe,.msi,.apk,.ipa">
                <ul class="community-compose-attachments" id="editAttachmentList"></ul>
            </section>
        </aside>
    </div>
</main>

<!-- 发布二次确认 -->
<div class="ws-modal" id="publishModal" hidden>
    <div class="ws-modal__card" role="dialog" aria-modal="true" aria-labelledby="publishModalTitle">
        <div class="ws-modal__header"><h3 id="publishModalTitle">确认发布文章？</h3></div>
        <div class="ws-modal__body">
            <div class="ws-modal__row"><span>标题：</span><b id="modalTitle"></b></div>
            <div class="ws-modal__row"><span>分类：</span><b id="modalCategory"></b></div>
            <div class="ws-modal__notice">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span>发布后将展示在交流社区，你仍可在个人中心继续编辑。</span>
            </div>
        </div>
        <div class="ws-modal__footer">
            <button class="ws-modal__btn ws-modal__btn--ghost" id="cancelPublish" type="button">取消</button>
            <button class="ws-modal__btn ws-modal__btn--primary" id="confirmPublish" type="button">确认发布</button>
        </div>
    </div>
</div>

<!-- 草稿恢复 -->
<div class="ws-draft-bar" id="draftBar" hidden>
    <span class="ws-draft-bar__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </span>
    <div class="ws-draft-bar__body">
        <div class="ws-draft-bar__title">检测到未发布的草稿</div>
        <div class="ws-draft-bar__desc">你上次编辑的内容尚未发布，是否恢复？</div>
        <div class="ws-draft-bar__actions">
            <button class="ws-draft-bar__restore" id="draftRestore" type="button">恢复草稿</button>
            <button class="ws-draft-bar__discard" id="draftDiscard" type="button">放弃</button>
        </div>
    </div>
</div>

<script th:src="@{/lib/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/common.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@11.2.0/marked.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/profile-article-edit.js}"></script>
</body>
</html>
