<!DOCTYPE html>
<html lang="zh-CN" th:lang="${#locale.language == 'en' ? 'en' : 'zh-CN'}" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.register.title}">注册 iLink</title>
    <th:block th:replace="fragments/head-assets :: auth"></th:block>
</head>
<body class="auth-page--register">
    <button type="button" id="languageSwitch" class="auth-language-switch" th:text="#{language.switch}" th:attr="aria-label=#{language.switchLabel}">EN</button>
    <div class="floating-shapes" aria-hidden="true">
        <div class="shape shape--1"></div>
        <div class="shape shape--2"></div>
        <div class="shape shape--3"></div>
        <div class="shape shape--4"></div>
        <div class="shape shape--5"></div>
    </div>

    <!-- Auth Card -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-card__header">
                <h1 class="auth-card__title" th:text="#{auth.register.heading}">加入 iLink</h1>
                <p class="auth-card__subtitle" th:text="#{auth.register.subtitle}">连接师生，让竞赛协作从这里开始</p>
            </div>

            <!-- Form -->
            <form id="registerForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <!-- 身份选择 -->
                <div class="form-group">
                    <label th:text="#{auth.register.role}">身份</label>
                    <div class="identifier-toggle">
                        <button type="button" class="identifier-toggle__btn active" data-identity="student" id="toggleStudent" onclick="switchIdentity('STUDENT')" th:text="#{auth.register.student}">学生</button>
                        <button type="button" class="identifier-toggle__btn" data-identity="teacher" id="toggleTeacher" onclick="switchIdentity('TEACHER')" th:text="#{auth.register.teacher}">教师</button>
                    </div>
                    <div class="error-message il-field-hint" id="identityError"></div>
                </div>

                <!-- Identifier Type Toggle -->
                <div class="form-group">
                    <label id="identifierGroupLabel" th:text="#{auth.register.phoneGroup.student}">手机号 / 学号</label>
                    <div class="identifier-toggle">
                        <button type="button" class="identifier-toggle__btn active" id="togglePhone" onclick="switchIdentifierType('phone')" th:text="#{auth.register.phoneMode}">手机号注册</button>
                        <button type="button" class="identifier-toggle__btn" id="toggleStudentId" onclick="switchIdentifierType('studentId')" th:text="#{auth.register.studentIdMode}">学号注册</button>
                    </div>
                    <div class="input-wrapper" id="phoneWrapper">
                        <input type="tel" id="phone" name="phone"
                               placeholder="请输入手机号" th:attr="placeholder=#{auth.register.phone.placeholder}" autocomplete="tel">
                    </div>
                    <div class="input-wrapper" id="studentIdWrapper" style="display:none;">
                        <input type="text" id="studentId" name="studentId"
                               placeholder="请输入学号" th:attr="placeholder=#{auth.register.studentId.placeholder}">
                    </div>
                    <div class="error-message il-field-hint" id="identifierError"></div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email" th:text="#{auth.register.email}">邮箱</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="用于接收验证码，也是登录与找回密码的凭据" th:attr="placeholder=#{auth.register.email.placeholder}" required autocomplete="email" maxlength="100">
                    </div>
                    <div class="error-message il-field-hint" id="emailError"></div>
                </div>

                <!-- Email verification code -->
                <div class="form-group">
                    <label for="emailCode" th:text="#{auth.register.emailCode}">邮箱验证码</label>
                    <div class="input-wrapper code-row">
                        <input type="text" id="emailCode" name="emailCode" inputmode="numeric" maxlength="6" placeholder="6 位数字" th:attr="placeholder=#{auth.register.emailCode.placeholder}" required autocomplete="one-time-code">
                        <button type="button" class="code-btn" id="sendEmailCodeBtn" th:text="#{auth.register.sendCode}">获取验证码</button>
                    </div>
                    <div class="error-message il-field-hint" id="emailCodeError"></div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" th:text="#{auth.register.password}">密码</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password"
                               placeholder="8-32位，含字母和数字" th:attr="placeholder=#{auth.register.password.placeholder}" required minlength="8" autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', 'eyeIcon1', 'eyeOffIcon1')" th:attr="aria-label=#{auth.toggle.showPassword}">
                            <svg id="eyeIcon1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="eyeOffIcon1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <div class="error-message il-field-hint" id="passwordError"></div>
                </div>

                <!-- 确认密码 -->
                <div class="form-group">
                    <label for="confirmPassword" th:text="#{auth.register.passwordConfirm}">确认密码</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               placeholder="请再次输入密码" th:attr="placeholder=#{auth.register.passwordConfirm.placeholder}" required minlength="8" autocomplete="new-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', 'eyeIcon2', 'eyeOffIcon2')" th:attr="aria-label=#{auth.toggle.showPassword}">
                            <svg id="eyeIcon2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="eyeOffIcon2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <div class="error-message il-field-hint" id="confirmPasswordError"></div>
                </div>

                <!-- Agreement -->
                <div class="agreement-wrapper">
                    <input type="checkbox" id="agreement" name="agreement" required>
                    <span><span th:text="#{auth.legal.prefix}">我已阅读并同意</span> <a href="/terms.html" target="_blank" class="il-link" rel="noopener" th:text="#{auth.legal.terms}">用户协议</a> <span th:text="#{auth.legal.and}">和</span> <a href="/privacy.html" target="_blank" class="il-link" rel="noopener" th:text="#{auth.legal.privacy}">隐私政策</a></span>
                </div>

                <button type="submit" class="btn-submit" id="registerBtn" th:text="#{auth.register.submit}">创建账号</button>

                <div id="errorMessage" class="alert"></div>
            </form>

            <!-- Footer -->
            <div class="auth-card__footer">
                <span th:text="#{auth.register.loginPrompt}">已有账号？</span><a href="/login" class="il-link" th:text="#{auth.register.loginLink}">登录</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/register.js}"></script>
    <script>        /* === Password visibility toggle === */
        function togglePasswordVisibility(inputId, eyeId, eyeOffId) {
            const input = document.getElementById(inputId);
            const eyeIcon = document.getElementById(eyeId);
            const eyeOffIcon = document.getElementById(eyeOffId);
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.style.display = 'none';
                eyeOffIcon.style.display = 'block';
                const toggle = input.closest('.input-wrapper').querySelector('.toggle-password');
                if (toggle) toggle.setAttribute('aria-label', t('auth.toggle.hidePassword'));
            } else {
                input.type = 'password';
                eyeIcon.style.display = 'block';
                eyeOffIcon.style.display = 'none';
                const toggle = input.closest('.input-wrapper').querySelector('.toggle-password');
                if (toggle) toggle.setAttribute('aria-label', t('auth.toggle.showPassword'));
            }
        }

        /* === Identifier type toggle (phone / studentId) === */
        let currentIdentifierType = 'phone';

        function switchIdentifierType(type) {
            currentIdentifierType = type;
            const phoneWrapper = document.getElementById('phoneWrapper');
            const studentIdWrapper = document.getElementById('studentIdWrapper');
            const togglePhone = document.getElementById('togglePhone');
            const toggleStudentId = document.getElementById('toggleStudentId');

            if (type === 'phone') {
                phoneWrapper.style.display = 'block';
                studentIdWrapper.style.display = 'none';
                togglePhone.classList.add('active');
                toggleStudentId.classList.remove('active');
                document.getElementById('phone').setAttribute('required', 'required');
                document.getElementById('studentId').removeAttribute('required');
            } else {
                phoneWrapper.style.display = 'none';
                studentIdWrapper.style.display = 'block';
                togglePhone.classList.remove('active');
                toggleStudentId.classList.add('active');
                document.getElementById('studentId').setAttribute('required', 'required');
                document.getElementById('phone').removeAttribute('required');
            }
        }

        /* === Identity type toggle (student / teacher) === */
        window.currentIdentity = 'STUDENT';

        function switchIdentity(identity) {
            window.currentIdentity = identity;
            const toggleStudent = document.getElementById('toggleStudent');
            const toggleTeacher = document.getElementById('toggleTeacher');

            if (identity === 'STUDENT') {
                toggleStudent.classList.add('active');
                toggleTeacher.classList.remove('active');
            } else {
                toggleStudent.classList.remove('active');
                toggleTeacher.classList.add('active');
            }
            syncRegistrationIdentityLabels();
            clearFieldHint('identityError');
        }

        function syncRegistrationIdentityLabels() {
            const isTeacher = window.currentIdentity === 'TEACHER';
            const identityLabel = isTeacher ? t('auth.register.staffId') : t('auth.register.studentIdLabel');
            const groupLabel = document.getElementById('identifierGroupLabel');
            const idToggle = document.getElementById('toggleStudentId');
            const idInput = document.getElementById('studentId');
            const subtitle = document.querySelector('.auth-card__subtitle');
            if (groupLabel) groupLabel.textContent = t(isTeacher ? 'auth.register.phoneGroup.teacher' : 'auth.register.phoneGroup.student');
            if (idToggle) idToggle.textContent = t(isTeacher ? 'auth.register.staffIdMode' : 'auth.register.studentIdMode');
            if (idInput) idInput.placeholder = t(isTeacher ? 'auth.register.staffId.placeholder' : 'auth.register.studentId.placeholder');
            if (subtitle) {
                subtitle.textContent = isTeacher
                    ? t('auth.register.teacherSubtitle')
                    : t('auth.register.subtitle');
            }
        }
    </script>
    <th:block th:replace="fragments/feedback-widget :: widget"></th:block>
</body>
</html>
