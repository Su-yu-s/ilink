<!DOCTYPE html>
<html lang="zh-CN" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - iLink</title>
    <th:block th:replace="fragments/head-assets :: auth"></th:block>
</head>
<body class="auth-page--login">
    <div class="floating-shapes" aria-hidden="true">
        <div class="shape shape--1"></div><div class="shape shape--2"></div>
        <div class="shape shape--3"></div><div class="shape shape--4"></div>
    </div>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-logo"><div class="brand-logo__icon">iL</div></div>

            <section id="passwordResetRequestPanel">
                <div class="auth-card__header">
                    <h1 class="auth-card__title">找回密码</h1>
                    <p class="auth-card__subtitle">输入账号；若已绑定邮箱，我们会发送一次性重置链接</p>
                </div>
                <form id="passwordResetRequestForm">
                    <div class="form-group">
                        <label for="resetAccount">手机号、学号/工号或邮箱</label>
                        <div class="input-wrapper">
                            <input id="resetAccount" autocomplete="username" required
                                   placeholder="请输入账号信息">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">发送重置邮件</button>
                </form>
            </section>

            <section id="passwordResetConfirmPanel" hidden>
                <div class="auth-card__header">
                    <h1 class="auth-card__title">设置新密码</h1>
                    <p class="auth-card__subtitle">重置链接 30 分钟内有效，成功使用后立即失效</p>
                </div>
                <form id="passwordResetConfirmForm">
                    <div class="form-group">
                        <label for="resetNewPassword">新密码</label>
                        <div class="input-wrapper">
                            <input type="password" id="resetNewPassword" autocomplete="new-password"
                                   minlength="8" maxlength="32" required placeholder="8-32 位，含大小写字母和数字">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="resetConfirmPassword">确认新密码</label>
                        <div class="input-wrapper">
                            <input type="password" id="resetConfirmPassword" autocomplete="new-password"
                                   minlength="8" maxlength="32" required placeholder="请再次输入新密码">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">确认重置密码</button>
                </form>
            </section>

            <div class="auth-card__footer"><a href="/login.html" class="il-link">返回登录</a></div>
        </div>
    </div>
    <script src="/js/common.js?v=9.1"></script>
    <script src="/js/forgot-password.js?v=1.0"></script>
</body>
</html>
