<!DOCTYPE html>
<html lang="zh-CN" class="ilink-app" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的文章 - iLink</title>

    <th:block th:replace="fragments/head-assets :: core(bootstrap=true)"></th:block>
    <link th:href="@{/css/profile.css}" rel="stylesheet">
    <link th:href="@{/css/profile-refresh.css}" rel="stylesheet">
</head>
<body data-profile-page="posts" class="ilink-page-bg" th:attr="data-user-id=${currentUser != null ? currentUser.id : null}">
    <div th:replace="fragments/header :: header(${currentUser}, '')"></div>

    <div class="il-page-wrapper">
        <div class="il-profile-layout">
            <div th:replace="~{fragments/profile-sidebar :: sidebar (active='posts')}"></div>

            <div class="il-profile-content">
                <div class="il-section-card">
                    <div class="il-section-header">
                        <div>
                            <h2 class="il-section-title">我的文章</h2>
                            <p class="il-section-subtitle">在社区发布的文章会出现在这里，可随时编辑或删除</p>
                        </div>
                        <a href="/community.html" class="il-btn il-btn-primary">去社区发布新文章</a>
                    </div>

                    <div class="pf-toolbar">
                        <div class="pf-toolbar__search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                            <input type="text" id="pfSearchInput" class="pf-toolbar__input" placeholder="搜索文章标题...">
                        </div>
                        <div class="pf-toolbar__divider"></div>
                        <div class="pf-toolbar__filters">
                            <select id="pfCategorySelect" class="pf-toolbar__select">
                                <option value="all">全部分类</option>
                            </select>
                            <select id="pfSortSelect" class="pf-toolbar__select">
                                <option value="latest">最新发布</option>
                                <option value="views">最多阅读</option>
                                <option value="likes">最多点赞</option>
                            </select>
                        </div>
                    </div>

                    <div id="myPostsList" style="min-height: 100px;">
                        <p class="text-muted mb-0" style="font-size: 14px;">加载中…</p>
                    </div>
                    <nav id="myPostsPager" class="d-none mt-4" aria-label="分页">
                        <ul class="pagination pagination-sm justify-content-center mb-0" id="myPostsPagerInner"></ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/lib/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/profile.js}"></script>
    <script th:src="@{/js/profile-posts.js}"></script>
    <script th:src="@{/js/profile-refresh.js}"></script>
</body>
</html>
