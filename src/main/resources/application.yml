server:
  port: ${SERVER_PORT:8090}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    whitelabel:
      enabled: false

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  access-url-prefix: ${FILE_ACCESS_URL_PREFIX:/uploads/}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # 激活 dev 时一并激活本地私有 profile local（application-local.yml 已 gitignore，文件缺失时静默跳过）
    group:
      dev: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ilink?useUnicode=true&characterEncoding=utf8&useSSL=${DB_USE_SSL:true}&serverTimezone=Asia/Shanghai
#    username: ${DB_USERNAME:ilink}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme_in_production}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    out-of-order: false
    baseline-on-migrate: true
    baseline-version: '0'
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    repair-on-migrate: false
  thymeleaf:
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      cache:
        period: ${STATIC_CACHE_PERIOD:0}
      chain:
        compressed: true
        strategy:
          content:
            enabled: true
      # 切勿将 Thymeleaf 模板目录暴露为静态资源，否则存在源码泄露风险
      static-locations: classpath:/static/

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.ilink.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  level:
    org.springframework: info
    com.baomidou.mybatisplus: info

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8090}
  mail:
    # 发件人须为 Resend 已验证域名下的地址（ilink.work 已验证）
    from: "${APP_MAIL_FROM:iLink <noreply@ilink.work>}"
    # 留空则回落 SMTP / 开发日志；生产用环境变量注入
    resend-api-key: ${RESEND_API_KEY:}
  api:
    expose-error-detail: false
  ai:
    # 阿里云百炼 DashScope（OpenAI 兼容模式）。此处不给默认 Key：dev 由不入库的 application-local.yml 提供，prod 必须用环境变量。
    # 聊天/抽取 = qwen3.7-flash（AiClient 中关闭思考模式）；知识图谱 Embedding = qwen3.7-text-embedding-flash（同账号 Key 通用）
    enabled: ${AI_ENABLED:true}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${DASHSCOPE_API_KEY:}
    model: ${DASHSCOPE_MODEL:qwen3.7-flash}
    # 全局生成硬上限：图谱抽取（密集技术文档 JSON 实测 3700+ token）需要 6144，其余调用方各自传 ≤2048
    max-tokens: ${AI_MAX_TOKENS:6144}
    timeout-ms: 60000
    # 联网搜索：Bing 公开网页搜索为 AI 答疑补充上下文（AI_SEARCH_ENABLED=false 可关闭）
    search-enabled: ${AI_SEARCH_ENABLED:true}
    search-max-results: ${AI_SEARCH_MAX_RESULTS:5}
    # 知识图谱 Embedding（Qwen 文本向量，OpenAI 兼容接口）。
    # 未配置 Key 时向量化/向量检索自动降级，抽取入库与关键词检索不受影响。
    embedding:
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
      timeout-ms: 30000
  feedback:
    # 意见反馈推送到开发者微信（Server酱 https://sct.ftqq.com）。
    # 同样不给默认值：dev 由不入库的 application-local.yml 提供，prod 必须用环境变量。
    # 留空则只落库不推送，反馈功能本身不受影响。
    serverchan-sendkey: ${SERVERCHAN_SENDKEY:}
    enabled: ${FEEDBACK_PUSH_ENABLED:true}

management:
  endpoints:
    web:
      base-path: /actuator
