server:
  port: ${SERVER_PORT:8090}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    whitelabel:
      enabled: false

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  access-url-prefix: ${FILE_ACCESS_URL_PREFIX:/uploads/}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # 激活 dev 时一并激活本地私有 profile local（application-local.yml 已 gitignore，文件缺失时静默跳过）
    group:
      dev: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ilink?useUnicode=true&characterEncoding=utf8&useSSL=${DB_USE_SSL:true}&serverTimezone=Asia/Shanghai
#    username: ${DB_USERNAME:root}
    username: ${DB_USERNAME:ilink}
    password: ${DB_PASSWORD:changeme_in_production}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      leak-detection-threshold: 60000
  flyway:
    enabled: true
    out-of-order: false
    baseline-on-migrate: true
    baseline-version: '0'
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    repair-on-migrate: false
  thymeleaf:
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      cache:
        period: ${STATIC_CACHE_PERIOD:0}
      chain:
        compressed: true
        strategy:
          content:
            enabled: true
      # 切勿将 Thymeleaf 模板目录暴露为静态资源，否则存在源码泄露风险
      static-locations: classpath:/static/

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.ilink.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

logging:
  level:
    org.springframework: info
    com.baomidou.mybatisplus: info

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8090}
  mail:
    from: ${APP_MAIL_FROM:no-reply@ilink.local}
  api:
    expose-error-detail: false
  ai:
    # Agnes AI（OpenAI 兼容）。此处不给默认值：dev 由不入库的 application-local.yml 提供，prod 必须用环境变量。
    # 国际站节点：https://apihub.agnes-ai.com/v1（默认国内节点更快）
    enabled: ${AI_ENABLED:true}
    base-url: ${AGNES_BASE_URL:https://apihub.agnes-ai.cn/v1}
    api-key: ${AGNES_API_KEY:}
    model: ${AGNES_MODEL:agnes-2.5-flash}
    max-tokens: 2048
    timeout-ms: 60000
    daily-quota: ${AI_DAILY_QUOTA:20}
    # 联网搜索：Bing 公开网页搜索为 AI 答疑补充上下文（AI_SEARCH_ENABLED=false 可关闭）
    search-enabled: ${AI_SEARCH_ENABLED:true}
    search-max-results: ${AI_SEARCH_MAX_RESULTS:5}

management:
  endpoints:
    web:
      base-path: /actuator
