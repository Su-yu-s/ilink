legal.privacy.ai=第三方 AI 服务
legal.privacy.ai.body=使用 AI 助手时，任务标题、描述、类型、截止时间和竞赛名称，或竞赛答疑中的问题、竞赛公开资料和联网搜索结果，会发送给阿里云百炼模型服务。群聊内容和成员个人资料不会发送给 AI 服务。
legal.privacy.safeguards.password=密码以 bcrypt 哈希形式保存。生产环境通过 HTTPS 提供服务；本地开发环境可能使用 HTTP。
legal.privacy.safeguards.audit=平台内部按最小必要原则分配数据访问权限，操作留有审计记录。
legal.privacy.safeguards.retention=账号存续期间，平台会保存提供服务所需的数据。注销账号后，账号及关联资料、发布内容、团队协作记录、通知和站内消息会按注销流程清理。
