# Privacy policy body copy (trusted static HTML from this bundle)
legal.privacy.s1.body=<p class="lg-p">iLink 只会收集支撑组队、导师招募、协作与成果展示所必需的信息。具体包括：</p><ul class="lg-list"><li><b>账号信息</b>：手机号、学号 / 工号、邮箱、经 bcrypt 哈希处理的密码与身份类型（学生 / 教师 / 管理员）。</li><li><b>资料信息</b>：姓名、头像、性别，以及你填写的学校、学院、专业、年级、技能标签、个人简介与荣誉奖项；教师还可填写职称、研究方向与导师简介。</li><li><b>协作记录</b>：你发布的组队需求、提交的申请、加入的团队、团队任务与里程碑进度，以及团队文档、表格、材料要求、证据关联和人工复核记录。</li><li><b>发布与团队文件</b>：社区文章、成果作品、上传的附件、团队资料库文件，以及为知识检索而生成的正文摘录、索引状态和来源位置。</li><li><b>安全与管理记录</b>：记住登录状态的设备标识（浏览器标识）、编辑租约与版本冲突记录，以及管理员操作记录中的 IP 地址和浏览器标识。平台目前不提供异常登录识别。</li></ul>
legal.privacy.s2.body=<div class="lg-def"><div class="lg-def__row"><div class="lg-def__k">提供核心功能</div><div class="lg-def__v">完成登录、发布组队需求、申请加入队伍、在团队空间协作并展示成果。</div></div><div class="lg-def__row"><div class="lg-def__k">匹配与推荐</div><div class="lg-def__v">根据你填写的专业、技能与参赛方向，把合适的队伍、导师和竞赛推送到你的页面。</div></div><div class="lg-def__row"><div class="lg-def__k">通知与提醒</div><div class="lg-def__v">在你收到入队申请、审批结果、任务变更或站内消息时提醒你。</div></div><div class="lg-def__row"><div class="lg-def__k">安全与秩序</div><div class="lg-def__v">管理员可维护平台内容并管理账号状态；账号暂停后将无法登录，恢复前不能继续使用平台功能。</div></div></div>
legal.privacy.s3.body=<p class="lg-p">不同页面展示的信息范围不同。以下说明以当前版本的实际展示为准：</p><ul class="lg-list"><li><span class="lg-tag lg-tag--public">公开</span>　你填写的姓名、头像、学校、学院、专业、年级、个人简介与荣誉奖项，以及你主动发布的社区文章和成果作品。未填写姓名时，页面显示按身份生成的称呼。</li><li><span class="lg-tag lg-tag--private">不公开</span>　手机号、邮箱、学号 / 工号、密码和内部账号标识，不会出现在公开主页或公开用户资料中。</li><li><span class="lg-tag lg-tag--private">用于组队申请</span>　技能标签用于组队匹配及申请人资料展示，不显示在公开主页。</li><li><span class="lg-tag lg-tag--private">仅团队可见</span>　团队空间里的任务、讨论、周报、文档、表格、材料矩阵与资料库文件，只有该团队成员能看到；设置为受限范围的文档或表格，仅创建者、队长、导师及获得明确授权的成员可以读取。</li></ul><div class="lg-note"><p class="lg-note__t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>关于联系方式</p><p>如果你在个人简介里主动写下微信、QQ 等联系方式，它会被其他访客看到。建议先通过站内消息沟通，确认对方身份后再交换联系方式。</p></div>
legal.privacy.s4.body=<p class="lg-p">iLink 不会出售你的个人信息，也不会把信息用于与竞赛协作无关的广告投放。仅在以下情况中，信息可能被提供给平台之外：</p><ul class="lg-list"><li>你主动使用平台接入的第三方功能。使用 AI 助手或 Agent 工作台时，你的问题、当前用户有权读取的任务事实、竞赛公开资料、团队文档或表格正文摘录，以及资料库文件解析出的文本摘录，可能会发送给阿里云百炼模型服务。系统会先按团队成员身份、团队状态、文档可见范围和显式授权过滤检索范围；受限内容不会进入无权用户的检索上下文，团队群聊和成员个人资料不会发送给 AI 服务。</li><li>法律法规要求，或司法机关、监管部门依法提出要求。</li></ul>
legal.privacy.s5.body=<ul class="lg-list"><li>密码以 bcrypt 哈希形式保存。生产环境通过 HTTPS 提供服务；本地开发环境可能使用 HTTP。</li><li>团队文档、表格、材料与资料库文件均按团队和可见范围校验访问。文档和表格使用编辑租约与版本号避免互相覆盖，操作留有审计事件。</li><li>AI 助手只能提出协作动作建议，必须由你确认后才会写入文档、表格或材料。每次执行都会记录动作编号、执行人、目标资产与版本，审计记录不保存文档正文和编辑租约令牌。</li><li>为支持知识检索，平台会异步提取 PDF、Office、Markdown、文本和表格正文并建立索引。图片、压缩包、安装包等无法安全提取正文的文件标记为不索引；失败、删除或失去权限的内容不会继续作为可检索来源。</li><li>账号存续期间，平台会保存提供服务所需的数据。注销账号后，账号及关联资料、发布内容、团队协作记录、通知和站内消息会按注销流程清理。</li></ul>
legal.privacy.s6.body=<div class="lg-def"><div class="lg-def__row"><div class="lg-def__k">查看与更正</div><div class="lg-def__v">在「个人中心」查看和修改个人资料；用户名是系统内部标识，不能自行修改。</div></div><div class="lg-def__row"><div class="lg-def__k">删除内容</div><div class="lg-def__v">你可以删除自己发布的组队需求、社区文章与成果作品。</div></div><div class="lg-def__row"><div class="lg-def__k">注销账号</div><div class="lg-def__v">在「个人中心 - 注销账号」中验证当前密码并确认注销。账号及相关数据将被删除且无法恢复；若你是仍有已通过成员团队的创建者，须先转让或解散团队。</div></div><div class="lg-def__row"><div class="lg-def__k">其他请求</div><div class="lg-def__v">如需获取资料副本或对信息处理有疑问，可通过页面右下角的意见反馈联系管理员。</div></div></div>
legal.privacy.s7.body=<p class="lg-p">iLink 面向高校师生。未满 18 周岁的用户建议在监护人指导下使用，并避免在公开资料中填写家庭住址、身份证号等敏感信息。</p>
legal.privacy.s8.body=<p class="lg-p">当本政策发生可能影响你权益的调整时，平台会在站内通知中提示，并更新页面顶部的日期与版本号。继续使用平台即表示你已了解更新后的内容。</p><p class="lg-p">对本政策有疑问，可通过「意见反馈」入口联系平台管理员。</p>

# Terms body copy (trusted static HTML from this bundle)
legal.terms.t1.body=<p class="lg-p">iLink 是面向高校师生的竞赛组队与协作平台，帮助你找到队友、导师和赛事机会，并在团队空间里推进项目、沉淀成果。</p><p class="lg-p">注册账号、发布内容或加入团队，即表示你已阅读并同意本协议。如果你不同意其中任何内容，请停止使用平台。</p>
legal.terms.t2.body=<div class="lg-def"><div class="lg-def__row"><div class="lg-def__k">真实身份</div><div class="lg-def__v">请使用真实、可联系的身份信息参与组队、导师申请与成果发布。组队是人与人的协作，虚假身份会直接损害其他同学的信任。</div></div><div class="lg-def__row"><div class="lg-def__k">账号归属</div><div class="lg-def__v">一个账号对应一位使用者。请勿将账号出借、出租或转让给他人，也不要与他人共用账号。</div></div><div class="lg-def__row"><div class="lg-def__k">账号安全</div><div class="lg-def__v">请妥善保管密码。若发现账号被他人使用，请立即修改密码并通过意见反馈联系管理员。</div></div><div class="lg-def__row"><div class="lg-def__k">教师身份</div><div class="lg-def__v">教师注册后即获得导师身份。请如实填写任职单位、院系与研究方向，资料完整后会自动展示在导师墙。</div></div></div>
legal.terms.t3.body=<p class="lg-p">平台上的组队需求、社区文章与成果作品都应当与高校竞赛协作相关。发布时请注意：</p><ul class="lg-list"><li><b>内容真实</b>：不发布虚假招募、夸大的竞赛成绩或冒用他人身份的信息。</li><li><b>不侵犯他人权益</b>：上传的文档、图片、代码需为你本人拥有或已获得授权，并注明引用来源。</li><li><b>不干扰他人</b>：不发布广告、刷屏内容、人身攻击或与竞赛无关的推广信息。</li><li><b>不涉及违规内容</b>：不发布违反法律法规、涉及学术不端或泄露他人隐私的内容。</li></ul><div class="lg-note"><p class="lg-note__t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>关于组队信息</p><p>发起组队时请写清竞赛名称、所需技能与分工安排。信息越具体，越容易找到合适的队友，也能减少后续的分歧。</p></div>
legal.terms.t4.body=<div class="lg-def"><div class="lg-def__row"><div class="lg-def__k">申请与审批</div><div class="lg-def__v">加入团队的申请由团队创建者或已加入团队的导师审批。请如实填写申请理由，审批人可根据项目需要选择成员。</div></div><div class="lg-def__row"><div class="lg-def__k">成员退出</div><div class="lg-def__v">退出团队前请先与队友沟通。频繁加入后立即退出会影响其他同学的协作安排。</div></div><div class="lg-def__row"><div class="lg-def__k">导师参与</div><div class="lg-def__v">导师需先作为成员加入团队，之后才能查看该团队的协作记录、任务进度与周报。</div></div><div class="lg-def__row"><div class="lg-def__k">团队文件</div><div class="lg-def__v">团队空间内的任务、讨论、文档、表格、材料与文件仅对团队成员可见。受限内容仅向获授权成员开放，请勿擅自对外传播。</div></div><div class="lg-def__row"><div class="lg-def__k">协同编辑</div><div class="lg-def__v">文档和表格可能由多人先后编辑。请尊重版本记录与编辑占用提示，不要尝试覆盖他人的未保存内容。</div></div><div class="lg-def__row"><div class="lg-def__k">材料与 AI 建议</div><div class="lg-def__v">AI 生成的材料关联或复核建议仅供参考，最终结论应由有权成员依据证据确认。团队删除、归档或成员退出后，相关内容的可检索范围会同步收回。</div></div></div>
legal.terms.t5.body=<ul class="lg-list"><li><b>你保留所有权</b>：你发布的文章、成果与上传的附件，著作权仍归你或原权利人所有。</li><li><b>平台获得展示授权</b>：为在平台内展示与传播，你授权平台在站内展示、存储和提供下载你主动公开的内容。</li><li><b>团队协作内容</b>：团队空间内共同产生的成果，其权利归属由团队成员自行约定，平台不介入分配。</li></ul>
legal.terms.t6.body=<p class="lg-p">iLink 提供信息连接与协作管理工具，帮助师生之间建立联系、推进项目。同时需要说明：</p><ul class="lg-list"><li>平台<b>不保证</b>竞赛结果，也不参与赛事的评审与评选。</li><li>竞赛的报名时间、参赛资格与规则以<b>赛事官方信息</b>为准，请在报名前自行核对。</li><li>队员之间在平台之外的沟通与线下行为，由参与者自行负责。</li><li>平台会尽力保障服务稳定，但不对不可抗力或第三方原因导致的服务中断承担责任。</li></ul>
legal.terms.t7.body=<p class="lg-p">当出现违反本协议的行为时，平台会根据情节轻重采取相应措施：</p><ul class="lg-list"><li><span class="lg-tag lg-tag--public">提醒</span>　对轻微违规，通过站内通知提醒并提示改正。</li><li><span class="lg-tag lg-tag--stop">下架</span>　移除违规内容，例如虚假招募、侵权文档或广告信息。</li><li><span class="lg-tag lg-tag--stop">暂停账号</span>　对冒用他人身份、发布虚假招募或恶意干扰协作等行为，管理员可暂停相关账号使用。暂停期间无法登录，管理员恢复账号后方可继续使用。</li></ul><p class="lg-p">如果你认为处理结果有误，可以通过意见反馈提交说明，管理员会重新核查。</p>
legal.terms.t8.body=<p class="lg-p">当本协议发生可能影响你权益的调整时，平台会在站内通知中提示，并更新页面顶部的日期与版本号。继续使用平台即表示你已了解更新后的内容。</p><p class="lg-p">对本协议有疑问，可通过「意见反馈」入口联系平台管理员。</p>

